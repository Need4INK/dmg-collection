<style>
/* VOICE: a small, friendly workbench tool, quiet and precise.
   IDEA: the page behaves like a DMG body: warm grey shell, green screen, maroon A button.
   PICTURE: the photo itself, framed like the Game Boy screen, with draggable corners.
   COLOUR and TYPE: shell grey, screen green #9bbc0f/#0f380f, maroon accent; Pixelify Sans title, Inter body.
   LAYOUT: one calm column: title, screen with photo, controls, straightened result. */
/* Always dark, whatever the phone's light/dark setting */
:root,:root[data-theme=light],:root[data-theme=dark]{color-scheme:dark;--bg:#18191c;--ink:#e9e7e2;--soft:#a3a5a8;
--screen:#0f380f;--lcd:#9bbc0f;--a:#9a2257;--card:#25272b;--line:#3b3e44}
html{background:#18191c}
*{box-sizing:border-box;min-width:0}
body{margin:0;min-height:100vh;background:radial-gradient(120% 60% at 50% 0%,#26282d 0%,var(--bg) 70%) no-repeat,var(--bg);color:var(--ink);font:16px/1.55 Inter,system-ui,sans-serif;overflow-x:clip}
main{max-width:640px;margin:0 auto;padding:8px 16px 8px}
/* The whole group sits centred on the screen, clear of the status bar. */
body{display:flex;flex-direction:column;justify-content:center;min-height:100vh;min-height:100dvh;padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom)}main{width:100%}
h1{font:600 clamp(30px,8vw,40px)/1.05 "Pixelify Sans",system-ui,sans-serif;margin:0 0 6px;text-wrap:balance}
h2{font:600 20px/1.2 "Pixelify Sans",system-ui,sans-serif;margin:0 0 10px}
.sub{color:var(--soft);margin:0 0 12px;font-size:15px}

.screen{background:var(--screen);position:absolute;left:13.2%;top:8.3cqw;width:73.6%;height:67cqw;display:grid;place-items:center;overflow:hidden}
#view{display:none;touch-action:none;position:absolute;inset:0;width:100%;height:100%}
.screen,#view,.out img{-webkit-touch-callout:none;-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent}
.empty{text-align:center;color:var(--lcd);padding:8px}
.empty p{margin:10px 0 0;font-size:12px;opacity:.85;white-space:nowrap}
.empty .btn{font-size:15px;padding:0 16px}
/* Screen lens measured from a reference photo of the DMG lens (797 x 600). The screen window is enlarged and centred (13.2-86.8% across, 8.9-97.9% down, between the stripes and the bottom) with the original 1.1:1 proportion; bottom-right radius halved;
   stripes at 4.1% / 6.4% height, caption ends at 82.2%, right stripes 83.7-95%, LED at 6.9% / 38.7%, large bottom-right radius. */
.lens{position:relative;aspect-ratio:100/77.1;background:#7c7482;border-radius:10px 10px 30px 10px;container-type:inline-size;box-shadow:inset 0 1px 0 rgba(255,255,255,.12),0 2px 0 rgba(0,0,0,.18)}
.lens .band{position:absolute;top:3cqw;height:3.5cqw} /* caption and stripes 1.5x the original size */
.lens .st{background:linear-gradient(#ab2b64 0 27%,transparent 27% 73.5%,#141a6a 73.5% 100%)}
.lens .lrow{left:3.8%;width:83%;display:flex;align-items:center;gap:2.3cqw}
.lens .lrow .st{flex:1;height:100%}
.lens .cap{font:500 4.43cqw/1 Jost,Futura,"Century Gothic",system-ui,sans-serif;color:#ccc6d2;letter-spacing:.02em;white-space:nowrap}
.lens .rs{left:88.3%;width:7.9%}
.led{position:absolute;left:6.9%;top:30.7cqw;width:4%;aspect-ratio:1;transform:translate(-50%,-50%);border-radius:50%;background:#3b2a31;box-shadow:inset 0 1px 2px rgba(0,0,0,.55)}
.led.on{background:#ff3b30;box-shadow:0 0 1.6cqw #ff3b30,inset 0 -1px 2px rgba(0,0,0,.3)}
.status{margin:8px 2px 0;color:var(--soft);font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;min-height:44px;padding:0 18px;border-radius:22px;border:0;font:600 15px Inter,system-ui,sans-serif;cursor:pointer;background:var(--card);color:var(--ink);box-shadow:inset 0 0 0 1px var(--line)}
.btn.a{background:var(--a);color:#fff;box-shadow:0 2px 0 #5e1235}
.btn.lcd{background:var(--lcd);color:var(--screen);box-shadow:0 2px 0 #306230;font-size:16px}
.btn:focus-visible{outline:3px solid var(--lcd);outline-offset:2px}
.btn[disabled]{opacity:.45}
.row{display:flex;flex-wrap:wrap;gap:8px;margin-top:14px}
[hidden]{display:none!important}
.row.one{display:grid;grid-template-columns:repeat(3,minmax(0,1fr))}.row.one .btn{padding:0 6px;white-space:nowrap}
.btn.saved{background:#306230;color:#e8f5b0;box-shadow:0 2px 0 #0f380f}
.pair{display:grid;gap:8px;margin-top:10px}.pair .btn{width:100%;white-space:nowrap;padding:0 10px}
.codebox{margin-top:10px;padding:8px 14px 10px;border-radius:12px;background:var(--card)}
.codebox label{font-weight:600;font-size:15px}
.coderow{display:grid;grid-template-columns:minmax(0,1fr);margin-top:4px}
.coderow input{min-height:44px;border-radius:10px;border:1px solid var(--line);background:var(--bg);color:var(--ink);font:600 17px ui-monospace,Menlo,monospace;padding:0 12px;text-transform:uppercase}
.coderow input.bad{border-color:#d0453a;box-shadow:0 0 0 1px #d0453a}
.game{margin-top:8px;padding:6px 12px;border-radius:10px;background:var(--bg)}
.game b{display:block;font-size:17px;line-height:1.3;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.game .sm{font-size:14px;color:var(--soft);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sugg{display:flex;flex-wrap:wrap;gap:8px;margin-top:8px}.sugg .btn[data-act]{font:600 15px Inter,system-ui,sans-serif;flex:1;white-space:nowrap;padding:0 10px}.sugg .btn{min-height:40px;font:600 15px ui-monospace,Menlo,monospace}
.coderow input:focus-visible{outline:3px solid var(--lcd);outline-offset:1px}
@media(max-width:360px){.row.one .btn{font-size:14px}}
input[type=file]{position:absolute;width:1px;height:1px;opacity:0;pointer-events:none}
.result{margin-top:10px}
.game .ph{color:var(--soft);font-weight:600}
.game .own{color:var(--lcd)}
/* ownership flag before the game name: read-only box, ticked when the game is in the collection */
.flag{display:inline-block;position:relative;width:18px;height:18px;margin-right:8px;vertical-align:-2px;border:2px solid var(--lcd);border-radius:4px;box-sizing:border-box;pointer-events:none}
.flag.on{background:var(--lcd)}.flag.on::after{content:"";position:absolute;left:4px;top:0;width:5px;height:10px;border:solid #0f380f;border-width:0 2.5px 2.5px 0;transform:rotate(45deg)}
.flag.dim{opacity:.35}
.out{display:grid;grid-template-columns:minmax(0,150px) minmax(0,1fr);gap:16px;align-items:stretch}
.side{display:flex;flex-direction:column;justify-content:space-between;gap:8px}
.meta.one{margin:0;font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;text-align:center}
.side .pair{margin:0;gap:6px}
/* three stacked buttons beside the photo, kept to the photo's height */
.side{gap:4px}.side .btn{min-height:38px}
/* Save / Add image: two buttons that look like one pill broken in two along a slanted cut (4px gap).
   Each half is as wide as its longest label + equal padding, so the two labels sit centred across the whole pill.
   Labels for every state overlap in one cell (only the current one visible), so a half never changes width. */
.split{display:flex}
.split .btn{flex:1 1 auto;width:auto;white-space:nowrap;padding:0 14px;min-width:0}
.split .btn:first-child{border-radius:19px 0 0 19px;clip-path:polygon(0 0,100% 0,calc(100% - 9px) 100%,0 100%)}
.split .btn:last-child{border-radius:0 19px 19px 0;margin-left:-5px;clip-path:polygon(9px 0,100% 0,100% 100%,0 100%)}
.split .btn[hidden]{display:none}.split .btn[hidden]+.btn{margin-left:0;border-radius:19px;clip-path:none}
.split .btn.saved{background:#306230;color:#e8f5b0;box-shadow:none}
.lb{display:grid}.lb>span{grid-area:1/1;visibility:hidden;text-align:center}
[data-s=""] .lb>[data-s=""],[data-s=saved] .lb>[data-s=saved],[data-s=failed] .lb>[data-s=failed],[data-s=added] .lb>[data-s=added]{visibility:visible}
.cartshape{filter:drop-shadow(0 6px 10px rgba(0,0,0,.3))}
.out img{width:100%;display:block;background:#000}
/* On-screen only: DMG cart outline (step notch top right, 8.6% x 4.7%, smooth rounded corners) with a darker grey edge. The saved photo stays a plain rectangle. */
.frame,.out img,.cart,.cart img{clip-path:polygon(0% 3.85%,0.09% 3.1%,0.34% 2.37%,0.75% 1.71%,1.3% 1.13%,1.97% 0.65%,2.73% 0.29%,3.57% 0.07%,4.43% 0%,90.13% 0%,90.62% 0.08%,91.03% 0.32%,91.3% 0.68%,91.4% 1.1%,91.4% 3.6%,91.5% 4.02%,91.77% 4.38%,92.18% 4.62%,92.67% 4.7%,98.73% 4.7%,99.22% 4.78%,99.63% 5.02%,99.9% 5.38%,100% 5.8%,100% 96.15%,99.91% 96.9%,99.66% 97.63%,99.25% 98.29%,98.7% 98.87%,98.03% 99.35%,97.27% 99.71%,96.43% 99.93%,95.57% 100%,4.43% 100%,3.57% 99.93%,2.73% 99.71%,1.97% 99.35%,1.3% 98.87%,0.75% 98.29%,0.34% 97.63%,0.09% 96.9%,0% 96.15%)}
.frame{background:#5d5a63;padding:4px}
.meta{font-size:14px;color:var(--soft)}
.meta b{color:var(--ink);font-weight:600}
@media(max-width:480px){.out{grid-template-columns:minmax(0,150px) minmax(0,1fr)}}

/* ---------- Collection: Home cover, Catalog, Game (one screen shown at a time) ---------- */
body{display:block}
.scr{display:none}
#scan.on{display:flex;flex-direction:column;justify-content:flex-start;min-height:calc(100dvh - env(safe-area-inset-top) - env(safe-area-inset-bottom))}
#scan main{padding:41px 20px 8px} /* lens sits exactly where the cover's grey banner sits, same corners */
.app.on{display:flex;flex-direction:column;gap:14px;height:calc(100dvh - env(safe-area-inset-top) - env(safe-area-inset-bottom));max-width:640px;margin:0 auto;padding:14px 20px 16px;overflow:hidden;line-height:1.3}
.app button{font-family:inherit;cursor:pointer;-webkit-tap-highlight-color:transparent}
.banner{flex:none;background:#7c7482;border-radius:10px 10px 30px 10px;padding:14px 16px 16px;display:flex;flex-direction:column;gap:12px;box-shadow:inset 0 1px 0 rgba(255,255,255,.12),0 2px 0 rgba(0,0,0,.18)}
/* Cover: the top band is kept only as a spacer (banner stays put); the banner carries the scanner lens's stripes at the same spot instead. */
#home .topband{visibility:hidden}
#home .banner{position:relative;container-type:inline-size;padding-top:calc(6.5% + 12px)}
/* Same layout as the scanner lens (stripes + caption). cqw here = banner width minus its 32px side padding, hence the small px corrections. */
.bband{position:absolute;top:calc(3cqw + .96px);height:calc(3.5cqw + 1.12px)}
.bst{background:linear-gradient(#ab2b64 0 27%,transparent 27% 73.5%,#141a6a 73.5% 100%)}
.brow{left:3.8%;width:83%;display:flex;align-items:center;gap:calc(2.3cqw + .74px)}.brow .bst{flex:1;height:100%}
.bcap{font:500 calc(4.43cqw + 1.42px)/1 Jost,Futura,"Century Gothic",system-ui,sans-serif;color:#ccc6d2;letter-spacing:.02em;white-space:nowrap}
.brs{left:88.3%;width:7.9%}
.stripes{display:flex;flex-direction:column;gap:3px}.stripes i{height:4px;background:#ab2b64}.stripes i+i{background:#1f2470}
.bnr{display:flex;align-items:center;gap:16px}
.ring{--p:0;flex:none;width:92px;height:92px;border-radius:50%;background:conic-gradient(#9bbc0f calc(var(--p)*1%),#3a3740 0);display:grid;place-items:center}
.ring span{width:68px;height:68px;border-radius:50%;background:#7c7482;display:grid;place-items:center;font:700 22px/1 Jost,system-ui,sans-serif;color:#141416}
.btx{display:flex;flex-direction:column;gap:3px;color:#1a181d;font-size:12px}
.big{font:700 38px/1 Jost,system-ui,sans-serif}.big small{font-size:18px}
.lbl{font:700 12px/1.2 Jost,system-ui,sans-serif;letter-spacing:2px}
.card{background:#1c1a20;border-radius:12px;padding:12px 14px 14px;display:flex;flex-direction:column;gap:9px;flex:none}
.card.grow{flex:1;min-height:0}
.ch{display:flex;justify-content:space-between;align-items:center;font-size:12px;color:#a9a4b0}
.lnk{background:none;border:0;color:#a9a4b0;font:12px Inter,system-ui,sans-serif;padding:6px 0 6px 12px;margin:-6px 0}
.gwrap{flex:1;min-height:0;position:relative}.gwrap canvas{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);touch-action:none;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
.gtip{position:absolute;z-index:2;left:0;top:0;pointer-events:none;transform:translate(-50%,-100%);max-width:100%;background:#2a2730;color:#fff;font:600 13px/1.2 Inter,system-ui,sans-serif;padding:6px 10px;border-radius:8px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;box-shadow:0 4px 14px rgba(0,0,0,.5)}.gtip[hidden]{display:none}
.gloupe{position:absolute;z-index:2;left:0;top:0;width:124px;height:92px;border-radius:44px;pointer-events:none;transform:translate(-50%,-50%);background:#1c1a20;box-shadow:0 0 0 1px rgba(255,255,255,.14),0 10px 28px rgba(0,0,0,.55),0 2px 6px rgba(0,0,0,.4)}
.app{-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}.app input{-webkit-user-select:text;user-select:text}.gloupe[hidden]{display:none}
.recent{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}
.rc{display:flex;flex-direction:column;gap:4px;background:none;border:0;padding:0;color:#a9a4b0;font:9px/1.2 Inter,system-ui,sans-serif;text-align:left}
.rc span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-height:11px}
.cw{position:relative;display:block}
.cart{display:block;aspect-ratio:56/65;width:100%;background:#5d5a63;padding:2px}.cart img{display:block;width:100%;height:100%;object-fit:cover;background:#a09ca7}
.ghost{display:block;aspect-ratio:56/65;width:100%;border:1px dashed #4a4651;border-radius:4px 10px 4px 4px;background:#26232a}

.wide{flex:none;height:52px;border-radius:12px;border:0;background:#2a2730;color:#fff;font:700 15px Jost,system-ui,sans-serif;letter-spacing:2px;margin:auto 64px 0 0}
.fab{position:fixed;z-index:5;right:max(20px,calc(50vw - 300px));bottom:calc(16px + env(safe-area-inset-bottom));width:52px;height:52px;padding:0;border-radius:50%;border:0;background:#ab2b64;color:#fff;display:grid;place-items:center;box-shadow:0 4px 14px rgba(0,0,0,.5);cursor:pointer;-webkit-tap-highlight-color:transparent}
.fab .x{display:none}.fab.close .x{display:block}.fab.close .p{display:none}
.top{display:flex;align-items:center;gap:12px;flex:none}
.back{flex:none;width:44px;height:44px;border-radius:50%;background:#1c1a20;border:0;color:#fff;display:grid;place-items:center;padding:0}
.tt{display:flex;flex-direction:column;gap:4px;flex:1}.tt b{font:700 18px/1.2 Jost,system-ui,sans-serif;letter-spacing:2px}
.topband{flex:none;margin-top:2px}

.mini{display:flex;gap:3px;width:48px}.mini i{flex:1;height:3px;background:#ab2b64}.mini i+i{background:#1f2470}
.cnt{font:700 16px Jost,system-ui,sans-serif}.cnt small{font-size:16px;color:#a9a4b0;font-weight:500}
.search{flex:none;display:flex;align-items:center;gap:8px;height:44px;background:#1c1a20;border-radius:12px;padding:0 14px;color:#a9a4b0}
.search input{flex:1;height:100%;background:transparent;border:0;color:#fff;font:16px Inter,system-ui,sans-serif;outline:none;-webkit-appearance:none;appearance:none}

.seg{flex:none;display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:4px;background:#1c1a20;border-radius:12px;padding:4px}

.tiles{flex:1;min-height:0;overflow-y:auto;overscroll-behavior:contain;display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px 8px;align-content:start;padding:0 0 84px;-webkit-mask-image:linear-gradient(#000 calc(100% - 48px),transparent);mask-image:linear-gradient(#000 calc(100% - 48px),transparent)}
.tile{display:flex;flex-direction:column;gap:5px;background:none;border:0;padding:0;color:#e8e6ea;text-align:left;font:10px/1.25 Inter,system-ui,sans-serif}

<body>
<!-- Home cover -->
<div class="scr app on" id="home">

 const u=URL.createObjectURL(r.thumb||r.full);THUMB.set(code,u);return u}
function cartHTML(i,cls='',dot){const own=OWN_GAMES.has(i),pc=own&&photoCode(i);
 return own?`<span class="cw"><span class="cart"><img alt="" ${pc?`data-c="${pc}" src="${PLACE}"`:`src="${PLACE}"`}></span>${dot?((n=>n>1?`<i class="dot">${n}</i>`:'<i class="dot"></i>')((OWN_GAMES.get(i)||[]).length)):''}</span>`:'<span class="ghost"></span>'}
// Photos load when their tile scrolls into view.
const lazy=new IntersectionObserver(es=>{for(const e of es){if(!e.isIntersecting)continue;const im=e.target;lazy.unobserve(im);
 thumbURL(im.dataset.c).then(u=>{if(!im.isConnected)return;im.src=u;if($('cGrid').contains(im))far.observe(im)})}},{rootMargin:'300px'});
// Catalog photos more than ~3 screens away are let go (less memory) and load again when scrolled back to.
const far=new IntersectionObserver(es=>{for(const e of es){const im=e.target;
 if(!im.isConnected){far.unobserve(im);continue}
 if(e.isIntersecting||!e.rootBounds||!e.rootBounds.height||cur!=='cat'||im.closest('[hidden]'))continue; // catalog hidden or tile filtered out: keep
 far.unobserve(im);im.src=PLACE;const c=im.dataset.c;if(THUMB.has(c)){URL.revokeObjectURL(THUMB.get(c));THUMB.delete(c)}lazy.observe(im)}},{root:$('cGrid'),rootMargin:'300% 0px'});
function loadThumbs(root){root.querySelectorAll('img[data-c]').forEach(im=>lazy.observe(im))}

// ---- navigation: one screen at a time; the round button opens the scanner (+) and closes it (×) ----
// Leaving the scanner empties it: next time it opens blank, like the first time.
function clearScan(){src=null;srcData=null;quad=null;rot=0;lastBlob=null;manual=false;ocrJob++;srcVer++;reading=false;pending=false;clearTimeout(rcT);ownAsk=null;
 view.style.display='none';$('empty').style.display='';for(const id of ['auto','reset','flip','save'])$(id).disabled=true;
 if(outURL){URL.revokeObjectURL(outURL);outURL=null}$('outImg').src=PLACE;$('outMeta').innerHTML=`<b>${OW}×${OH}</b> · –`;
 $('code').value='';codeChanged();status('')}
function go(id,push=true){if(id===cur)return refresh();if(push)stack.push(cur);if(cur==='scan'){preset=null;clearScan()}
 if(cur==='gv'&&gEditing)endEdit(); // left without Save: edits are dropped
 if(id==='home'&&$('cQ').value){$('cQ').value='';$('cQx').hidden=true;if(built)applyFilter()} // back on the cover: the catalog search starts empty again
 cur=id;
 for(const s of document.querySelectorAll('.scr'))s.classList.toggle('on',s.id===id);
 const f=$('fab'),sc=id==='scan';f.classList.toggle('close',sc);f.setAttribute('aria-label',sc?'Close scanner':'Scan a cart');
 if(sc)layout();refresh()}
function back(){go(stack.pop()||'home',false)}
// + on a game page opens the scanner with the shown variant's code already filled in (kept when a photo is picked).
$('fab').addEventListener('click',()=>{if(cur==='scan')return back();const c=cur==='gv'?gSel:null;go('scan');
 if(c){preset=c;$('code').value=c;manual=true;codeChanged()}});
document.querySelectorAll('[data-back]').forEach(b=>b.addEventListener('click',back));
$('toCat').addEventListener('click',()=>go('cat'));
$('hAll').addEventListener('click',()=>{setFilter('own');go('cat')});
function refresh(){if(cur==='home')drawHome();else if(cur==='cat')drawCat();else if(cur==='gv')drawGame()}

// ---- Home cover ----
function drawHome(){const own=OWN_GAMES.size,p=TOTAL?Math.round(own/TOTAL*100):0;
 $('hRing').style.setProperty('--p',TOTAL?own/TOTAL*100:0);$('hPct').textContent=p+'%';$('hOwn').textContent=own;$('hTot').textContent=TOTAL;
 $('hSub').textContent=`${OWN_CODES.size} carts · ${TOTAL-own} to go`;drawGrid();
 const l=recentList().filter(r=>OWN_CODES.has(r.c)).slice(-4).reverse(),box=$('hRecent');let h='';
 for(let k=0;k<4;k++){const r=l[k];if(!r){h+='<span class="rc"><span class="ghost"></span><span></span></span>';continue}const i=gameIndex(r.c);
  h+=`<button class="rc" data-g="${i}"><span class="cw"><span class="cart"><img alt="" src="${PLACE}" ${PHOTOS.has(r.c)?`data-c="${r.c}"`:''}></span></span><span>${esc(r.c)}</span></button>`}
 box.innerHTML=h;loadThumbs(box)}
$('hRecent').addEventListener('click',e=>{const b=e.target.closest('[data-g]');if(b)openGame(+b.dataset.g)});
// Every game as one square, A → Z: green when owned. Squares are sized to fill the card.
// Press and slide over the squares: a bubble magnifies the squares under the finger and names the game; letting go opens it.
let GG=null,hHi=-1,hDown=false;
function drawGrid(){const w=$('hWrap'),cv=$('hGrid'),W=w.clientWidth,H=w.clientHeight;if(!W||!H)return;
 const cols=27,rows=Math.ceil(TOTAL/cols),g=2,s=Math.max(3,Math.floor(Math.min((W-(cols-1)*g)/cols,(H-(rows-1)*g)/rows)));
 const cw=cols*s+(cols-1)*g,ch=rows*s+(rows-1)*g,d=window.devicePixelRatio||1;
 if(!GG||GG.cw!==cw||GG.ch!==ch){cv.style.width=cw+'px';cv.style.height=ch+'px';cv.width=cw*d;cv.height=ch*d}GG={cols,s,g,cw,ch};
 const c=cv.getContext('2d');c.setTransform(d,0,0,d,0,0);c.clearRect(0,0,cw,ch);
 for(let i=0;i<TOTAL;i++){const x=(i%cols)*(s+g),y=Math.floor(i/cols)*(s+g);c.fillStyle=OWN_GAMES.has(i)?'#9bbc0f':'#2e2b34';c.fillRect(x,y,s,s)}
}
// Up to 28px outside the grid still picks the nearest square, so edge and corner squares are easy to reach.
function gridAt(e){if(!GG)return -1;const r=$('hGrid').getBoundingClientRect(),x=e.clientX-r.left,y=e.clientY-r.top,M=28;
 if(x<-M||y<-M||x>=GG.cw+M||y>=GG.ch+M)return -1;const st=GG.s+GG.g,rows=Math.ceil(TOTAL/GG.cols);
 const col=Math.max(0,Math.min(GG.cols-1,Math.floor(x/st))),row=Math.max(0,Math.min(rows-1,Math.floor(y/st))),i=row*GG.cols+col;
 return i<TOTAL?i:(y>=GG.ch?TOTAL-1:-1)}
// Glass magnifier above the finger (like the iOS one): a plain zoom of the grid, the picked square in the middle (ringed white), the title above it.
const LW=124,LH=92,LN=6.5,LR=44; // glass bubble size (px), squares across, corner radius
function drawLoupe(i){const cv=$('hLoupe'),src=$('hGrid'),d=window.devicePixelRatio||1;if(cv.width!==LW*d){cv.width=LW*d;cv.height=LH*d}
 const c=cv.getContext('2d');c.setTransform(1,0,0,1,0,0);c.clearRect(0,0,cv.width,cv.height);c.imageSmoothingEnabled=false;
 const st=GG.s+GG.g,z=LW/(LN*st),cx=(i%GG.cols)*st+GG.s/2,cy=Math.floor(i/GG.cols)*st+GG.s/2; // zoom factor; centre of the picked square
 c.setTransform(d*z,0,0,d*z,d*(LW/2-cx*z),d*(LH/2-cy*z));c.drawImage(src,0,0,GG.cw,GG.ch);
 c.lineWidth=2/z;c.strokeStyle='#fff';const h=GG.s/2+GG.g/2;c.strokeRect(cx-h,cy-h,2*h,2*h);
 // glass: darker rim, soft sheen on top, thin light edge
 c.setTransform(d,0,0,d,0,0);let g=c.createRadialGradient(LW/2,LH/2,LH*.3,LW/2,LH/2,LW*.62);g.addColorStop(0,'rgba(0,0,0,0)');g.addColorStop(1,'rgba(0,0,0,.45)');c.fillStyle=g;c.fillRect(0,0,LW,LH);
 g=c.createLinearGradient(0,0,0,LH*.5);g.addColorStop(0,'rgba(255,255,255,.16)');g.addColorStop(1,'rgba(255,255,255,0)');c.fillStyle=g;c.fillRect(0,0,LW,LH*.5);
 c.beginPath();c.roundRect(.75,.75,LW-1.5,LH-1.5,LR);c.lineWidth=1.5;c.strokeStyle='rgba(255,255,255,.28)';c.stroke()}
function gridHi(i){if(i===hHi)return;hHi=i;const tip=$('hTip'),lp=$('hLoupe');if(i<0){tip.hidden=lp.hidden=true;return}
 tip.textContent=GAMES[i][0];tip.hidden=lp.hidden=false;drawLoupe(i);
 const w=$('hWrap'),cv=$('hGrid'),wr=w.getBoundingClientRect(),cr=cv.getBoundingClientRect(),st=GG.s+GG.g;
 const sx=cr.left-wr.left+(i%GG.cols)*st+GG.s/2,sy=cr.top-wr.top+Math.floor(i/GG.cols)*st+GG.s/2,tw=tip.offsetWidth,th=tip.offsetHeight;
 const minTop=8-wr.top+th+8; // keep bubble and title on screen
 let ly=sy-34-LH/2;if(ly-LH/2<minTop)ly=sy+34+LH/2+th+8; // above the finger; below it if there's no room
 const lx=Math.max(LW/2+4,Math.min(wr.width-LW/2-4,sx));lp.style.left=lx+'px';lp.style.top=ly+'px';
 tip.style.left=Math.max(tw/2,Math.min(wr.width-tw/2,sx))+'px';tip.style.top=(ly-LH/2-8)+'px'}
const hCv=$('hGrid');
hCv.addEventListener('pointerdown',e=>{hDown=true;try{hCv.setPointerCapture(e.pointerId)}catch(_){}gridHi(gridAt(e))});
hCv.addEventListener('pointermove',e=>{if(hDown)gridHi(gridAt(e))});
hCv.addEventListener('pointerup',e=>{if(!hDown)return;hDown=false;const i=gridAt(e);gridHi(-1);if(i>=0)openGame(i)});
hCv.addEventListener('pointercancel',()=>{hDown=false;gridHi(-1)});
hCv.addEventListener('contextmenu',e=>e.preventDefault());
hCv.addEventListener('touchstart',e=>e.preventDefault(),{passive:false}); // no iOS long-press selection or magnifier over the grid
new ResizeObserver(()=>{if(cur==='home')drawGrid()}).observe($('hWrap'));

// ---- Catalog ----
let built=false;
function buildCat(){const g=$('cGrid');g.innerHTML=GAMES.map((x,i)=>`<button class="tile" data-g="${i}"></button>`).join('');built=true}
function fillTile(t){const i=+t.dataset.g,own=OWN_GAMES.has(i);t.querySelectorAll('img').forEach(im=>{lazy.unobserve(im);far.unobserve(im)});t.classList.toggle('miss',!own);
 t.innerHTML=cartHTML(i,'',true)+`<span class="nm">${esc(GAMES[i][0])}</span>`}
function drawCat(){if(!built)buildCat();const g=$('cGrid');
 if(dirty){g.querySelectorAll('.tile').forEach(fillTile);dirty=false;loadThumbs(g)}
 $('cCnt').innerHTML=`${OWN_GAMES.size}<small> / ${TOTAL}</small>`;
 const sp=$('cSeg').querySelectorAll('span');sp[0].textContent=TOTAL;sp[1].textContent=OWN_GAMES.size;sp[2].textContent=TOTAL-OWN_GAMES.size;sp[3].textContent=[...OWN_GAMES.values()].filter(v=>v.length>1).length;applyFilter()}
function setFilter(f){filt=f;$('cSeg').querySelectorAll('button').forEach(b=>b.classList.toggle('on',b.dataset.f===f));if(built)applyFilter()}
function applyFilter(){const q=$('cQ').value.trim().toLowerCase();
 $('cGrid').querySelectorAll('.tile').forEach(t=>{const i=+t.dataset.g,own=OWN_GAMES.has(i),G=GAMES[i];
  let ok=filt==='all'||(filt==='multi'?(OWN_GAMES.get(i)||[]).length>1:(filt==='own')===own);if(ok&&q)ok=G[0].toLowerCase().includes(q)||G[1].some(c=>c.toLowerCase().includes(q));t.hidden=!ok})}
$('cSeg').addEventListener('click',e=>{const b=e.target.closest('[data-f]');if(b){setFilter(b.dataset.f);$('cGrid').scrollTop=0}});
function setQuery(v){$('cQ').value=v;$('cQx').hidden=!v;applyFilter();$('cGrid').scrollTop=0}
$('cQ').addEventListener('input',()=>setQuery($('cQ').value));
$('cQx').addEventListener('click',()=>{setQuery('');$('cQ').focus()});
$('cQ').addEventListener('keydown',e=>{if(e.key==='Enter')$('cQ').blur()});
$('cGrid').addEventListener('click',e=>{const t=e.target.closest('[data-g]');if(t)openGame(+t.dataset.g)});

// ---- Game page: photo, variants, ownership ----
// gSel = the variant shown on the page: its photo, its English switch, and what + (scanner) and Forget photo act on.
// Each variant (exact code) keeps its own photo; tap a variant row to show it.
// Edit owned works on a draft: ticks and forgotten photos apply only on Save; leaving the page any other way drops them.
let gSel=null,gURL=null,gDraft=null,gForgot=null;
const pickSel=i=>{const mine=OWN_GAMES.get(i)||[];return photoCode(i)||GAMES[i][1].find(c=>PHOTOS.has(c))||mine[0]||GAMES[i][1][0]};
function openGame(i){gIdx=i;endEdit();gSel=pickSel(i);go('gv')}
function endEdit(){gEditing=false;gDraft=null;gForgot=null}
const isOwn=c=>gEditing?gDraft.has(c):OWN_CODES.has(c),hasPh=c=>PHOTOS.has(c)&&!(gEditing&&gForgot.has(c));
async function drawGame(){const i=gIdx,G=GAMES[i];if(!G)return;if(!G[1].includes(gSel))gSel=pickSel(i);
 const sel=gSel,own=isOwn(sel),has=hasPh(sel),mine=G[1].filter(isOwn);
 $('gT').textContent=G[0];$('gY').textContent=`${G[2]} · ${G[1].length} variant${G[1].length>1?'s':''}`;
 $('gO').textContent=mine.length?`Owned · ${mine.length} of ${G[1].length}`:'Missing';$('gO').className=mine.length?'own':'';
 $('enG').setAttribute('aria-checked',ENG.has(sel)?'true':'false');$('enG').setAttribute('aria-label','English · '+sel);
 $('gVars').classList.toggle('edit',gEditing);$('gEdit').classList.toggle('on',gEditing);$('gEdit').textContent=gEditing?'Save':'Edit owned';
 const f=$('gForget'),forgot=gEditing&&gForgot.has(sel);f.hidden=!gEditing;$('gRow').classList.toggle('solo',!gEditing);
 f.textContent=forgot?'Keep photo':'Forget photo';f.disabled=!(PHOTOS.has(sel));
 $('gVars').innerHTML=G[1].map(c=>{const o=isOwn(c),s=c.split('-').pop();
  return `<button class="vr${o?' on':''}${c===sel?' sel':''}" data-c="${c}">${FLAG(o)}<span class="cd">${c}</span>${ENG.has(c)?'<b class="en">EN</b>':''}<span>${esc(REGIONS[s]||s)}</span></button>`}).join('');
 const ph=$('gPh');ph.innerHTML=own||has?`<span class="cart"><img alt="${esc(G[0])} · ${sel}" src="${PLACE}"></span>`:'<span class="ghost"></span>';
 if(has){const r=await idb('readonly',s=>s.get(sel));if(r&&gIdx===i&&gSel===sel&&cur==='gv'){if(gURL)URL.revokeObjectURL(gURL);gURL=URL.createObjectURL(r.full);const im=ph.querySelector('img');if(im)im.src=gURL}}}
// Edit owned → Save: apply the draft (ownership + forgotten photos).
$('gEdit').addEventListener('click',async()=>{const G=GAMES[gIdx];if(!G)return;
 if(!gEditing){gEditing=true;gDraft=new Set(G[1].filter(c=>OWN_CODES.has(c)));gForgot=new Set();return drawGame()}
 const s=new Set(OWN_CODES),added=[];for(const c of G[1]){const o=gDraft.has(c);if(o&&!s.has(c))added.push(c);o?s.add(c):s.delete(c)}
 setOwned([...s]);try{localStorage.setItem('dmgOwned',JSON.stringify([...OWN_CODES]))}catch(e){}addRecent(added);
 for(const c of gForgot){await idb('readwrite',st=>st.delete(c));PHOTOS.delete(c);if(THUMB.has(c)){URL.revokeObjectURL(THUMB.get(c));THUMB.delete(c)}}
 dirty=true;endEdit();drawGame()});
// Tap a variant: show it; while editing also switch its tick.
$('gVars').addEventListener('click',e=>{const b=e.target.closest('[data-c]');if(!b)return;const c=b.dataset.c;gSel=c;
 if(gEditing)gDraft.has(c)?gDraft.delete(c):gDraft.add(c);drawGame()});
$('enG').addEventListener('click',()=>{if(!gSel)return;setEnglish(gSel,!ENG.has(gSel));drawGame()});
// Forget photo (while editing): marks the shown variant's photo to be deleted on Save; tap again (Keep photo) to undo.
$('gForget').addEventListener('click',()=>{const c=gSel;if(!gEditing||!c||!PHOTOS.has(c))return;gForgot.has(c)?gForgot.delete(c):gForgot.add(c);drawGame()});
// Ownership changed in the scanner: screens redraw when they are shown again.
$('own').addEventListener('click',()=>{dirty=true});
refresh();
}
</script>
</body>
