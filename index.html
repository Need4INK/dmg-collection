<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>DMG Cart Scanner</title>
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#18191c">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<meta name="apple-mobile-web-app-title" content="DMG Scanner">
<link rel="apple-touch-icon" href="icons/dmgdb3-180.png">
<link rel="icon" href="icons/dmgdb3-192.png">
<style>
@font-face{font-family:Jost;font-weight:500;font-display:swap;src:url(fonts/jost-latin-500-normal.woff2) format("woff2")}
@font-face{font-family:Inter;font-weight:400;font-display:swap;src:url(fonts/inter-latin-400-normal.woff2) format("woff2")}
@font-face{font-family:Inter;font-weight:600;font-display:swap;src:url(fonts/inter-latin-600-normal.woff2) format("woff2")}
@font-face{font-family:"Pixelify Sans";font-weight:600;font-display:swap;src:url(fonts/pixelify-sans-latin-600-normal.woff2) format("woff2")}
</style>
<style>
/* VOICE: a small, friendly workbench tool, quiet and precise.
   IDEA: the page behaves like a DMG body: warm grey shell, green screen, maroon A button.
   PICTURE: the photo itself, framed like the Game Boy screen, with draggable corners.
   COLOUR and TYPE: shell grey, screen green #9bbc0f/#0f380f, maroon accent; Pixelify Sans title, Inter body.
   LAYOUT: one calm column: title, screen with photo, controls, straightened result. */
/* Always dark, whatever the phone's light/dark setting */
:root,:root[data-theme=light],:root[data-theme=dark]{color-scheme:dark;--bg:#18191c;--ink:#e9e7e2;--soft:#a3a5a8;
--screen:#0f380f;--lcd:#9bbc0f;--a:#9a2257;--card:#25272b;--line:#3b3e44}
html{background:#18191c}
*{box-sizing:border-box;min-width:0}
body{margin:0;min-height:100vh;background:radial-gradient(120% 60% at 50% 0%,#26282d 0%,var(--bg) 70%) no-repeat,var(--bg);color:var(--ink);font:16px/1.55 Inter,system-ui,sans-serif;overflow-x:clip}
main{max-width:640px;margin:0 auto;padding:8px 16px 8px}
/* The whole group sits centred on the screen, clear of the status bar. */
body{display:flex;flex-direction:column;justify-content:center;min-height:100vh;min-height:100dvh;padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom)}main{width:100%}
h1{font:600 clamp(30px,8vw,40px)/1.05 "Pixelify Sans",system-ui,sans-serif;margin:0 0 6px;text-wrap:balance}
h2{font:600 20px/1.2 "Pixelify Sans",system-ui,sans-serif;margin:0 0 10px}
.sub{color:var(--soft);margin:0 0 12px;font-size:15px}

.screen{background:var(--screen);position:absolute;left:13.2%;top:8.3cqw;width:73.6%;height:67cqw;display:grid;place-items:center;overflow:hidden}
#view{display:none;touch-action:none;position:absolute;inset:0;width:100%;height:100%}
.screen,#view,.out img{-webkit-touch-callout:none;-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent}
.empty{text-align:center;color:var(--lcd);padding:8px}
.empty p{margin:10px 0 0;font-size:12px;opacity:.85;white-space:nowrap}
.empty .btn{font-size:15px;padding:0 16px}
/* Screen lens measured from a reference photo of the DMG lens (797 x 600). The screen window is enlarged and centred (13.2-86.8% across, 8.9-97.9% down, between the stripes and the bottom) with the original 1.1:1 proportion; bottom-right radius halved;
   stripes at 4.1% / 6.4% height, caption ends at 82.2%, right stripes 83.7-95%, LED at 6.9% / 38.7%, large bottom-right radius. */
.lens{position:relative;aspect-ratio:100/77.1;background:#7c7482;border-radius:1.5% 1.5% 8% 1.5% / 1.95% 1.95% 10.35% 1.95%;container-type:inline-size;box-shadow:inset 0 1px 0 rgba(255,255,255,.12),0 2px 0 rgba(0,0,0,.18)}
.lens .band{position:absolute;top:3cqw;height:3.5cqw} /* caption and stripes 1.5x the original size */
.lens .st{background:linear-gradient(#ab2b64 0 27%,transparent 27% 73.5%,#141a6a 73.5% 100%)}
.lens .lrow{left:3.8%;width:83%;display:flex;align-items:center;gap:2.3cqw}
.lens .lrow .st{flex:1;height:100%}
.lens .cap{font:500 4.43cqw/1 Jost,Futura,"Century Gothic",system-ui,sans-serif;color:#ccc6d2;letter-spacing:.02em;white-space:nowrap}
.lens .rs{left:88.3%;width:7.9%}
.led{position:absolute;left:6.9%;top:30.7cqw;width:4%;aspect-ratio:1;transform:translate(-50%,-50%);border-radius:50%;background:#3b2a31;box-shadow:inset 0 1px 2px rgba(0,0,0,.55)}
.led.on{background:#ff3b30;box-shadow:0 0 1.6cqw #ff3b30,inset 0 -1px 2px rgba(0,0,0,.3)}
.status{margin:8px 2px 0;color:var(--soft);font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;min-height:44px;padding:0 18px;border-radius:22px;border:0;font:600 15px Inter,system-ui,sans-serif;cursor:pointer;background:var(--card);color:var(--ink);box-shadow:inset 0 0 0 1px var(--line)}
.btn.a{background:var(--a);color:#fff;box-shadow:0 2px 0 #5e1235}
.btn.lcd{background:var(--lcd);color:var(--screen);box-shadow:0 2px 0 #306230;font-size:16px}
.btn:focus-visible{outline:3px solid var(--lcd);outline-offset:2px}
.btn[disabled]{opacity:.45}
.row{display:flex;flex-wrap:wrap;gap:8px;margin-top:14px}
[hidden]{display:none!important}
.row.one{display:grid;grid-template-columns:repeat(3,minmax(0,1fr))}.row.one .btn{padding:0 6px;white-space:nowrap}
.btn.saved{background:#306230;color:#e8f5b0;box-shadow:0 2px 0 #0f380f}
.pair{display:grid;gap:8px;margin-top:10px}.pair .btn{width:100%;white-space:nowrap;padding:0 10px}
.codebox{margin-top:10px;padding:8px 14px 10px;border-radius:12px;background:var(--card)}
.codebox label{font-weight:600;font-size:15px}
.coderow{display:grid;grid-template-columns:minmax(0,1fr);margin-top:4px}
.coderow input{min-height:44px;border-radius:10px;border:1px solid var(--line);background:var(--bg);color:var(--ink);font:600 17px ui-monospace,Menlo,monospace;padding:0 12px;text-transform:uppercase}
.coderow input.bad{border-color:#d0453a;box-shadow:0 0 0 1px #d0453a}
.game{margin-top:8px;padding:6px 12px;border-radius:10px;background:var(--bg)}
.game b{display:block;font-size:17px;line-height:1.3;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.game .sm{font-size:14px;color:var(--soft);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sugg{display:flex;flex-wrap:wrap;gap:8px;margin-top:8px}.sugg .btn{min-height:40px;font:600 15px ui-monospace,Menlo,monospace}
.coderow input:focus-visible{outline:3px solid var(--lcd);outline-offset:1px}
@media(max-width:360px){.row.one .btn{font-size:14px}}
input[type=file]{position:absolute;width:1px;height:1px;opacity:0;pointer-events:none}
.result{margin-top:10px}
.game .ph{color:var(--soft);font-weight:600}
.game .own{color:var(--lcd)}
/* ownership flag before the game name: read-only box, ticked when the game is in the collection */
.flag{display:inline-block;position:relative;width:18px;height:18px;margin-right:8px;vertical-align:-2px;border:2px solid var(--lcd);border-radius:4px;box-sizing:border-box;pointer-events:none}
.flag.on{background:var(--lcd)}.flag.on::after{content:"";position:absolute;left:4px;top:0;width:5px;height:10px;border:solid #0f380f;border-width:0 2.5px 2.5px 0;transform:rotate(45deg)}
.flag.dim{opacity:.35}
.out{display:grid;grid-template-columns:minmax(0,150px) minmax(0,1fr);gap:16px;align-items:stretch}
.side{display:flex;flex-direction:column;justify-content:space-between;gap:8px}
.meta.one{margin:0;font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;text-align:center}
.side .pair{margin:0;gap:6px}
/* three stacked buttons beside the photo, kept to the photo's height */
.side{gap:4px}.side .btn{min-height:38px}
.cartshape{filter:drop-shadow(0 6px 10px rgba(0,0,0,.3))}
.out img{width:100%;display:block;background:#000}
/* On-screen only: DMG cart outline (step notch top right, 8.6% x 4.7%, smooth rounded corners) with a darker grey edge. The saved photo stays a plain rectangle. */
.frame,.out img{clip-path:polygon(0% 3.85%,0.09% 3.1%,0.34% 2.37%,0.75% 1.71%,1.3% 1.13%,1.97% 0.65%,2.73% 0.29%,3.57% 0.07%,4.43% 0%,90.13% 0%,90.62% 0.08%,91.03% 0.32%,91.3% 0.68%,91.4% 1.1%,91.4% 3.6%,91.5% 4.02%,91.77% 4.38%,92.18% 4.62%,92.67% 4.7%,98.73% 4.7%,99.22% 4.78%,99.63% 5.02%,99.9% 5.38%,100% 5.8%,100% 96.15%,99.91% 96.9%,99.66% 97.63%,99.25% 98.29%,98.7% 98.87%,98.03% 99.35%,97.27% 99.71%,96.43% 99.93%,95.57% 100%,4.43% 100%,3.57% 99.93%,2.73% 99.71%,1.97% 99.35%,1.3% 98.87%,0.75% 98.29%,0.34% 97.63%,0.09% 96.9%,0% 96.15%)}
.frame{background:#5d5a63;padding:4px}
.meta{font-size:14px;color:var(--soft)}
.meta b{color:var(--ink);font-weight:600}
@media(max-width:480px){.out{grid-template-columns:minmax(0,150px) minmax(0,1fr)}}
</style>
</head>
<body>
<main>

<div class="lens">
  <div class="band lrow" aria-hidden="true"><i class="st"></i><span class="cap">DMG CART SCANNER</span></div>
  <i class="band st rs" aria-hidden="true"></i>
  <b class="led" id="led" aria-hidden="true"></b>
  <div class="screen" id="screen">
    <div class="empty" id="empty">
      <label class="btn lcd" for="file">Take or choose a photo</label>
      <p>One cart · label up · plain background</p>
    </div>
    <canvas id="view"></canvas>
  </div>
</div>

</div>
<input type="file" id="file" accept="image/*,.json,application/json">

<div class="row one" id="tools">
  <label class="btn a" for="file">New photo</label>
  <button class="btn" id="auto" disabled>Auto-detect</button>
  <button class="btn" id="reset" disabled>Reset</button>
</div>

<section class="result" id="result">
    <div class="out">
    <div class="cartshape"><div class="frame"><img id="outImg" alt="Straightened cart" src="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 56 65'%3E%3Crect width='56' height='65' fill='%23a09ca7'/%3E%3Crect x='8' y='3' width='40' height='9' rx='4.5' fill='%2394909b'/%3E%3Crect x='9' y='17' width='38' height='38' rx='1.5' fill='%238d8994'/%3E%3C/svg%3E"></div></div>
    <div class="side">
      <p class="meta one" id="outMeta"><b>560×650</b> · –</p>
      <div class="pair">
        <button class="btn" id="flip" disabled>Rotate 90° ↻</button>
        <button class="btn" id="save" hidden disabled>Save image</button>
        <button class="btn" id="own" disabled>Add to collection</button>
      </div>
      <p class="meta one" id="saveMsg"></p>
    </div>
  </div>
  <div class="codebox" id="codeBox">
    <label for="code">Label code</label>
    <div class="coderow"><input id="code" placeholder="DMG-…" autocomplete="off" autocapitalize="characters" spellcheck="false"></div>
    <div class="game" id="game"><b class="ph"><span class="flag dim" aria-hidden="true"></span>No game yet</b><div class="sm">Shown once the label code is read</div></div>
    <div class="sugg" id="sugg" hidden></div>
  </div>
</section>


</main>

<script src="data.js"></script>
<script>
{
// CORE START
function boxBlur(a,w,h,r){const t=new Float32Array(a.length),n=2*r+1;
 for(let y=0;y<h;y++){const o=y*w;let s=0;for(let x=-r;x<=r;x++)s+=a[o+Math.min(w-1,Math.max(0,x))];
  for(let x=0;x<w;x++){t[o+x]=s/n;s+=a[o+Math.min(w-1,x+r+1)]-a[o+Math.max(0,x-r)];}}
 for(let x=0;x<w;x++){let s=0;for(let y=-r;y<=r;y++)s+=t[Math.min(h-1,Math.max(0,y))*w+x];
  for(let y=0;y<h;y++){a[y*w+x]=s/n;s+=t[Math.min(h-1,y+r+1)*w+x]-t[Math.max(0,y-r)*w+x];}}}
function otsu(D){let mx=0;for(const v of D)if(v>mx)mx=v;if(mx<=0)return 0;const H=new Float64Array(256);
 for(const v of D)H[Math.min(255,(v/mx*255)|0)]++;const N=D.length;let sum=0;for(let i=0;i<256;i++)sum+=i*H[i];
 let sB=0,wB=0,best=-1,th=0;for(let i=0;i<256;i++){wB+=H[i];if(!wB)continue;const wF=N-wB;if(!wF)break;sB+=i*H[i];
  const v=wB*wF*(sB/wB-(sum-sB)/wF)**2;if(v>best){best=v;th=i;}}return (th+1)/255*mx;}
function morph(m,w,h,dil){const o=new Uint8Array(m.length);for(let y=0;y<h;y++)for(let x=0;x<w;x++){const c=m[y*w+x];let v=c;
 for(let dy=-1;dy<=1;dy++)for(let dx=-1;dx<=1;dx++){const yy=y+dy,xx=x+dx;const p=(yy<0||yy>=h||xx<0||xx>=w)?c:m[yy*w+xx];if(dil?p:!p)v=dil?1:0;}
 o[y*w+x]=v;}return o;}
function largest(m,w,h){const lab=new Int32Array(m.length),st=new Int32Array(m.length);let best=0,bestL=0,L=0;
 for(let i=0;i<m.length;i++){if(!m[i]||lab[i])continue;L++;let sp=0,n=0;st[sp++]=i;lab[i]=L;
  while(sp){const p=st[--sp];n++;const x=p%w,y=(p/w)|0;
   if(x>0&&m[p-1]&&!lab[p-1]){lab[p-1]=L;st[sp++]=p-1}
   if(x<w-1&&m[p+1]&&!lab[p+1]){lab[p+1]=L;st[sp++]=p+1}
   if(y>0&&m[p-w]&&!lab[p-w]){lab[p-w]=L;st[sp++]=p-w}
   if(y<h-1&&m[p+w]&&!lab[p+w]){lab[p+w]=L;st[sp++]=p+w}}
  if(n>best){best=n;bestL=L}}return {lab,L:bestL,area:best};}
function hull(P){P=P.slice().sort((a,b)=>a[0]-b[0]||a[1]-b[1]);const cr=(o,a,b)=>(a[0]-o[0])*(b[1]-o[1])-(a[1]-o[1])*(b[0]-o[0]);const lo=[],up=[];
 for(const p of P){while(lo.length>=2&&cr(lo[lo.length-2],lo[lo.length-1],p)<=0)lo.pop();lo.push(p)}
 for(let i=P.length-1;i>=0;i--){const p=P[i];while(up.length>=2&&cr(up[up.length-2],up[up.length-1],p)<=0)up.pop();up.push(p)}
 lo.pop();up.pop();return lo.concat(up);}
function area4(a,b,c,d){return Math.abs(a[0]*b[1]-b[0]*a[1]+b[0]*c[1]-c[0]*b[1]+c[0]*d[1]-d[0]*c[1]+d[0]*a[1]-a[0]*d[1])/2}
function order(Q){const cx=Q.reduce((s,p)=>s+p[0],0)/4,cy=Q.reduce((s,p)=>s+p[1],0)/4;
 Q=Q.slice().sort((a,b)=>Math.atan2(a[1]-cy,a[0]-cx)-Math.atan2(b[1]-cy,b[0]-cx));
 let s=0,m=Infinity;Q.forEach((p,i)=>{if(p[0]+p[1]<m){m=p[0]+p[1];s=i}});return Q.slice(s).concat(Q.slice(0,s));}
function refine(Q,P){const lines=[];
 for(let k=0;k<4;k++){const a=Q[k],b=Q[(k+1)%4];let ux=b[0]-a[0],uy=b[1]-a[1];const L=Math.hypot(ux,uy);ux/=L;uy/=L;
  let ln={px:a[0],py:a[1],ux,uy};
  for(let it=0;it<3;it++){const tol=it?Math.max(1.5,L*.015):Math.max(3,L*.05);let n=0,mx=0,my=0;const S=[];
   for(const p of P){const t=(p[0]-a[0])*ux+(p[1]-a[1])*uy;if(t<L*.15||t>L*.85)continue;
    const dd=Math.abs(-(p[0]-ln.px)*ln.uy+(p[1]-ln.py)*ln.ux);if(dd<=tol){S.push(p);mx+=p[0];my+=p[1];n++}}
   if(n<6)break;mx/=n;my/=n;let sxx=0,sxy=0,syy=0;for(const p of S){const dx=p[0]-mx,dy=p[1]-my;sxx+=dx*dx;sxy+=dx*dy;syy+=dy*dy}
   const th=.5*Math.atan2(2*sxy,sxx-syy);let vx=Math.cos(th),vy=Math.sin(th);if(vx*ux+vy*uy<0){vx=-vx;vy=-vy}
   ln={px:mx,py:my,ux:vx,uy:vy};}
  lines.push(ln);}
 const diag=Math.hypot(Q[0][0]-Q[2][0],Q[0][1]-Q[2][1]);
 return Q.map((q,k)=>{const l1=lines[(k+3)%4],l2=lines[k];const cr=l1.ux*l2.uy-l1.uy*l2.ux;if(Math.abs(cr)<1e-6)return q;
  const t=((l2.px-l1.px)*l2.uy-(l2.py-l1.py)*l2.ux)/cr;const p=[l1.px+t*l1.ux,l1.py+t*l1.uy];
  return Math.hypot(p[0]-q[0],p[1]-q[1])>diag*.1?q:p;});}
function detectCore(d,w,h){const N=w*h,R=new Float32Array(N),G=new Float32Array(N),B=new Float32Array(N);
 for(let i=0;i<N;i++){R[i]=d[i*4];G[i]=d[i*4+1];B[i]=d[i*4+2]}
 const br=Math.max(1,Math.round(Math.min(w,h)/150));boxBlur(R,w,h,br);boxBlur(G,w,h,br);boxBlur(B,w,h,br);
 const m=Math.max(2,Math.round(Math.min(w,h)*.03)),rs=[],gs=[],bs=[];
 for(let y=0;y<h;y+=2)for(let x=0;x<w;x+=2)if(x<m||y<m||x>=w-m||y>=h-m){const i=y*w+x;rs.push(R[i]);gs.push(G[i]);bs.push(B[i])}
 const med=a=>{a.sort((p,q)=>p-q);return a[a.length>>1]};const r0=med(rs),g0=med(gs),b0=med(bs);
 const D=new Float32Array(N);for(let i=0;i<N;i++)D[i]=Math.hypot(R[i]-r0,G[i]-g0,B[i]-b0);
 const th=Math.max(18,otsu(D));let M=new Uint8Array(N);for(let i=0;i<N;i++)M[i]=D[i]>th?1:0;
 M=morph(morph(M,w,h,1),w,h,0);M=morph(morph(M,w,h,0),w,h,1);
 const c=largest(M,w,h);if(c.area<N*.03||c.area>N*.97)return null;
 const P=[];for(let y=0;y<h;y++){let a=-1,b=-1;for(let x=0;x<w;x++)if(c.lab[y*w+x]===c.L){if(a<0)a=x;b=x}if(a>=0){P.push([a,y]);if(b!==a)P.push([b,y])}}
 for(let x=0;x<w;x++){let a=-1,b=-1;for(let y=0;y<h;y++)if(c.lab[y*w+x]===c.L){if(a<0)a=y;b=y}if(a>=0){P.push([x,a]);if(b!==a)P.push([x,b])}}
 let Hl=hull(P);if(Hl.length<4)return null;if(Hl.length>60){const s=[];for(let i=0;i<60;i++)s.push(Hl[Math.floor(i*Hl.length/60)]);Hl=s}
 let best=0,Q=null;const n=Hl.length;
 for(let i=0;i<n;i++)for(let j=i+1;j<n;j++)for(let k=j+1;k<n;k++)for(let l=k+1;l<n;l++){const A=area4(Hl[i],Hl[j],Hl[k],Hl[l]);if(A>best){best=A;Q=[Hl[i],Hl[j],Hl[k],Hl[l]]}}
 if(!Q||best<N*.02)return null;const F=refine(order(Q),P);
 const cx=F.reduce((a,p)=>a+p[0],0)/4,cy=F.reduce((a,p)=>a+p[1],0)/4;
 const inC=(x,y)=>{x=Math.round(x);y=Math.round(y);return x>=0&&y>=0&&x<w&&y<h&&c.lab[y*w+x]===c.L};
 const sc=F.map(p=>{let k=0,n=0;for(const f of [.05,.065,.08])for(const o of [-.02,0,.02]){
   const x=p[0]+(cx-p[0])*f+(cy-p[1])*o,y=p[1]+(cy-p[1])*f-(cx-p[0])*o;n++;if(inC(x,y))k++}return k/n});
 const lo=sc.indexOf(Math.min(...sc)),rest=sc.filter((v,i)=>i!==lo);
 const cut=sc[lo]<.5&&Math.min(...rest)>.75?lo:-1;return {q:F,cut};}
function homog(s,d){const A=[],B=[];
 for(let i=0;i<4;i++){const [x,y]=s[i],[u,v]=d[i];A.push([x,y,1,0,0,0,-u*x,-u*y]);B.push(u);A.push([0,0,0,x,y,1,-v*x,-v*y]);B.push(v)}

function loupePos(px,py,R){const cw=VW(),ch=VH(),m=8;

// Writes the cart details into the JPEG:
//  EXIF  ImageDescription (caption, shown and searchable in iPhone Photos) + Software
//  XMP   dc:title / dc:description / dc:subject keywords / xmp:CreatorTool + dmg:* app data (read back by the app later)
//  IPTC  ObjectName, Caption-Abstract, Keywords, OriginatingProgram
async function tagJpeg(blob,m){const src=new Uint8Array(await blob.arrayBuffer());if(src[0]!==0xFF||src[1]!==0xD8)return blob;
 const enc=new TextEncoder(),x=t=>String(t).replace(/[<>&"]/g,c=>({'<':'&lt;','>':'&gt;','&':'&amp;','"':'&quot;'}[c]));

 const cat=(...a)=>{const o=new Uint8Array(a.reduce((s,v)=>s+v.length,0));let p=0;for(const v of a){o.set(v,p);p+=v.length}return o};
 const APP='DMG Cart Scanner',kw=m.keywords||[];
 // EXIF: big-endian TIFF, IFD0 with ImageDescription (0x010E) and Software (0x0131)
 const vals=[[0x010E,cat(enc.encode(m.caption),new Uint8Array([0]))],[0x0131,cat(enc.encode(APP),new Uint8Array([0]))]];
 const n=vals.length,head=8+2+12*n+4;let data=new Uint8Array(0);const ifd=new Uint8Array(head),dv=new DataView(ifd.buffer);
 ifd.set([0x4D,0x4D,0,42,0,0,0,8]);dv.setUint16(8,n);
 vals.forEach(([tag,v],i)=>{const e=10+12*i;dv.setUint16(e,tag);dv.setUint16(e+2,2);dv.setUint32(e+4,v.length);
  if(v.length<=4)ifd.set(v,e+8);else{dv.setUint32(e+8,head+data.length);data=cat(data,v,v.length%2?new Uint8Array([0]):new Uint8Array(0))}});
 const exif=seg(0xE1,cat(enc.encode('Exif\0\0'),ifd,data));
 const d=m.data||{},dmg=Object.entries(d).map(([k,v])=>`<dmg:${k}>${x(typeof v==='string'?v:JSON.stringify(v))}</dmg:${k}>`).join('');
 const xmpS=`<?xpacket begin="﻿" id="W5M0MpCehiHzreSzNTczkc9d"?><x:xmpmeta xmlns:x="adobe:ns:meta/"><rdf:RDF xmlns:rdf="http://www.w3.org/1999/02/22-rdf-syntax-ns#"><rdf:Description rdf:about="" xmlns:dc="http://purl.org/dc/elements/1.1/" xmlns:xmp="http://ns.adobe.com/xap/1.0/" xmlns:dmg="https://dmg-cart-scanner.local/ns/1.0/"><dc:title><rdf:Alt><rdf:li xml:lang="x-default">${x(m.title)}</rdf:li></rdf:Alt></dc:title><dc:description><rdf:Alt><rdf:li xml:lang="x-default">${x(m.caption)}</rdf:li></rdf:Alt></dc:description><dc:subject><rdf:Bag>${kw.map(k=>`<rdf:li>${x(k)}</rdf:li>`).join('')}</rdf:Bag></dc:subject><xmp:CreatorTool>${APP}</xmp:CreatorTool>${dmg}</rdf:Description></rdf:RDF></x:xmpmeta><?xpacket end="w"?>`;

const REGIONS={USA:'North America',CAN:'Canada',EUR:'Europe',UKV:'United Kingdom',NOE:'Germany / Austria',FRG:'Germany',FRA:'France',ESP:'Spain',ITA:'Italy',HOL:'Netherlands',SCN:'Scandinavia',AUS:'Australia',ASI:'Asia',JPN:'Japan'};
// Master list from the collection spreadsheet: [names, codes, first release year]
const GAMES=DMG_GAMES;
const BY_CODE=new Map(),BY_ID=new Map(),ALL_CODES=[];

let OWN_CODES=new Set(),OWN_GAMES=new Map();
function setOwned(codes){OWN_CODES=new Set(codes.map(c=>String(c).trim().toUpperCase()).filter(Boolean));OWN_GAMES=new Map();
 for(const c of OWN_CODES){const i=gameIndex(c);if(i===undefined)continue;if(!OWN_GAMES.has(i))OWN_GAMES.set(i,[]);OWN_GAMES.get(i).push(c)}}
async function importOwned(f){try{const d=JSON.parse(await f.text()),codes=Array.isArray(d)?d:d.owned||d.codes;
 if(!Array.isArray(codes))throw 0;setOwned(codes);try{localStorage.setItem('dmgOwned',JSON.stringify([...OWN_CODES]))}catch(e){}

 if(v.includes('?')&&/^DMG-[A-Z0-9?]{2,4}-[A-Z?]{3}$/.test(v)){const re=new RegExp('^'+v.replace(/\?/g,'[A-Z0-9]')+'$'),m=ALL_CODES.filter(c=>re.test(c));
  if(m.length&&m.length<=8){sg.innerHTML=m.map(c=>`<button class="btn" data-c="${c}">${c}</button>`).join('');sg.hidden=false}}
 const i=gameIndex(v),exact=BY_CODE.has(v);
 if(i===undefined){box.innerHTML=CODE_RE.test(v)?'<b>'+FLAG(0,1)+'Not in your list</b><div class="sm">No game uses this code. Check it against the label.</div>':v?'<b class="ph">'+FLAG(0,1)+'No game yet</b><div class="sm">Format: DMG-XX-YYY or DMG-XXX-YYY</div>':'<b class="ph">'+FLAG(0,1)+'No game yet</b><div class="sm">Shown once the label code is read</div>';return}
 const g=GAMES[i],sfx=v.split('-').pop(),reg=REGIONS[sfx],mine=OWN_GAMES.get(i);
 // Owned game: check mark before the title, and whether this exact regional variant is in the collection.
 const hint=!mine?'':OWN_CODES.has(v)?'this variant owned':'owned as '+mine.map(c=>c.split('-').pop()).join(', ');
 box.innerHTML=`<b>${FLAG(!!mine)}${esc(g[0])}</b><div class="sm">${[g[2],reg||sfx,exact?'':'this region variant is not in your list'].filter(Boolean).map(esc).join(' · ')}${hint?' · <span class="own">'+esc(hint)+'</span>':''}</div>`}
// Short note in the game card (reading progress, problems).
const note=(t,d='')=>{$('game').innerHTML=`<b class="ph">${FLAG(0,1)}${esc(t)}</b><div class="sm">${esc(d)||'&nbsp;'}</div>`};
$('sugg').addEventListener('click',e=>{const b=e.target.closest('[data-c]');if(!b)return;$('code').value=b.dataset.c;manual=true;codeChanged()});
// Everything written into the saved photo: caption for Photos search, title, keywords, and app data to rebuild the collection later.
function photoMeta(code){const i=gameIndex(code),g=i===undefined?null:GAMES[i],sfx=code.split('-').pop(),reg=REGIONS[sfx]||sfx,id=code.split('-')[1]||'';
 const title=g?g[0]:code,year=g?String(g[2]):'';
 return {caption:[g&&g[0],code,g&&reg,year].filter(Boolean).join(' · '),title,
  keywords:['Game Boy','DMG',code,...(g?[reg,year]:[])].filter(Boolean),
  data:{Code:code,GameID:id,Title:g?g[0]:'',Region:sfx,RegionName:REGIONS[sfx]||'',Year:year,Rotation:String(rot),
   Corners:quad.map(p=>[+(p[0]/src.width).toFixed(4),+(p[1]/src.height).toFixed(4)]),Saved:new Date().toISOString()}}}

const CODE_RE=/^DMG-[A-Z0-9]{2,4}-[A-Z]{3}$/;
const fileName=()=>{const v=$('code').value.trim().toUpperCase().replace(/[^A-Z0-9-]/g,'_');return (v||'cart')+'.jpg'};

// The Save button itself shows the result, so nothing else on the page moves.
let saveTimer=0;function saveState(st){const b=$('save');clearTimeout(saveTimer);b.classList.toggle('saved',st==='saved');

// Built-in code reader: straighten at higher resolution, greyscale, then OCR.read (see OCR START).
// Reads by itself after every new crop (new photo, corner moved, flip, reset), unless the code was typed or picked by hand.
// It waits until the code box is on screen, and the reading runs in a background worker so the page never freezes.
let manual=false,rcT=0,pending=false,codeVisible=false,ocrW=null,ocrJob=0;
function scheduleRead(){pending=true;clearTimeout(rcT);if(codeVisible)rcT=setTimeout(readCode,350)}

// The worker gets the photo's pixels once per photo, then does the straightening, greyscale and OCR itself:
// the page only sends the 4 corners, so nothing heavy runs on the main thread.
let srcVer=0,sentVer=-1;
function ocrWorker(){if(ocrW)return ocrW;try{
 const js=`const DMG_GLYPHS=${JSON.stringify(DMG_GLYPHS)};const OCR=(${makeOCR.toString()})();OCR.setCodes(${JSON.stringify(ALL_CODES)});${homog.toString()}${warp.toString()}let S=null;
onmessage=e=>{const d=e.data;if(d.type==='src'){S={p:new Uint8ClampedArray(d.buf),w:d.w,h:d.h};return}
 let r=null;try{const W=1000,H=1160,px=new Uint8ClampedArray(W*H*4);warp(S.p,S.w,S.h,d.Q,W,H,px,true);const g=new Uint8Array(W*H);
  for(let i=0;i<W*H;i++)g[i]=(px[i*4]*77+px[i*4+1]*150+px[i*4+2]*29)>>8;r=OCR.read(g,W,H)}catch(x){}
 postMessage({id:d.id,r:r&&{code:r.code,known:!!r.known}})}`;
 ocrW=new Worker(URL.createObjectURL(new Blob([js],{type:'text/javascript'})));sentVer=-1}catch(e){ocrW=null}return ocrW}
function readCode(){if(!quad||manual||!pending)return;if(reading)return;pending=false;reading=true;note('Reading the code…');
 const Q=[0,1,2,3].map(i=>quad[(i+rot)%4]),job=++ocrJob,wk=ocrWorker();
 if(wk){wk.onmessage=e=>{if(e.data.id===job)done(e.data.r)};wk.onerror=()=>{ocrW=null;done(null,true)};
  if(sentVer!==srcVer){const buf=srcData.slice().buffer;wk.postMessage({type:'src',buf,w:src.width,h:src.height},[buf]);sentVer=srcVer}
  wk.postMessage({type:'read',id:job,Q})}
 else setTimeout(()=>{let r=null;try{const W=1000,H=1160,px=new Uint8ClampedArray(W*H*4);warp(srcData,src.width,src.height,Q,W,H,px,true);const g=new Uint8Array(W*H);
  for(let i=0;i<W*H;i++)g[i]=(px[i*4]*77+px[i*4+1]*150+px[i*4+2]*29)>>8;r=OCR.read(g,W,H)}catch(e){}done(r)},30);
 function done(r,err){reading=false;
  if(manual)codeChanged();
  else if(err)note('Could not read the code','Type it in by hand');
  else if(!r)note('Code not found','Try a sharper, closer photo, or type it in');
  else{$('code').value=r.code;codeChanged();if(r.code.includes('?'))note('Partly read','Pick a match below or fill in the ? by hand')}
  if(pending)scheduleRead()}}
$('flip').addEventListener('click',()=>{rot=(rot+3)%4;render()});
}
