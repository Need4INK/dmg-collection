<html lang="en">

<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">

<link rel="icon" href="icons/dmgdb3-192.png">
<style>
@font-face{font-family:Jost;font-weight:500;font-display:swap;src:url(fonts/jost-latin-500-normal.woff2) format("woff2")}
@font-face{font-family:Jost;font-weight:700;font-display:swap;src:url(fonts/jost-latin-700-normal.woff2) format("woff2")}
@font-face{font-family:Inter;font-weight:400;font-display:swap;src:url(fonts/inter-latin-400-normal.woff2) format("woff2")}
@font-face{font-family:Inter;font-weight:600;font-display:swap;src:url(fonts/inter-latin-600-normal.woff2) format("woff2")}
</style>
<style>
/* VOICE: a small, friendly workbench tool, quiet and precise.
   IDEA: the page behaves like a DMG body: warm grey shell, green screen, maroon A button.
   PICTURE: the photo itself, framed like the Game Boy screen, with draggable corners.
   COLOUR and TYPE: shell grey, screen green #9bbc0f/#0f380f, maroon accent; Jost headings/numbers, Inter body.
   LAYOUT: one calm column: title, screen with photo, controls, straightened result. */
/* Always dark, whatever the phone's light/dark setting */
:root{--W:100vw;--H:100vh;--st:env(safe-area-inset-top);--sb:env(safe-area-inset-bottom)}@supports (height:100dvh){:root{--H:100dvh}}
:root,:root[data-theme=light],:root[data-theme=dark]{color-scheme:dark;--bg:#18191c;--ink:#e9e7e2;--soft:#a3a5a8;
--screen:#0f380f;--lcd:#9bbc0f;--a:#9a2257;--card:#25272b;--line:#3b3e44}
html{background:#18191c}
*{box-sizing:border-box;min-width:0}
body{margin:0;min-height:var(--H);background:radial-gradient(120% 60% at 50% 0%,#26282d 0%,var(--bg) 70%) no-repeat,var(--bg);color:var(--ink);font:16px/1.55 Inter,system-ui,sans-serif;overflow-x:clip}
main{max-width:640px;margin:0 auto;padding:8px 16px 8px}
/* The whole group sits centred on the screen, clear of the status bar. */
body{display:flex;flex-direction:column;justify-content:center;min-height:var(--H);padding:var(--st) 0 var(--sb)}main{width:100%}

.screen{background:var(--screen);position:absolute;left:13.2%;top:8.3cqw;width:73.6%;height:67cqw;display:grid;place-items:center;overflow:hidden}
#view{display:none;touch-action:none;position:absolute;inset:0;width:100%;height:100%}
.screen,#view,.out img{-webkit-touch-callout:none;-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent}
.empty{text-align:center;color:var(--lcd);padding:8px}
.empty p{margin:10px 0 0;font-size:12px;opacity:.85;white-space:nowrap}
.empty .btn{font-size:15px;padding:0 16px}
/* Screen lens measured from a reference photo of the DMG lens (797 x 600). The screen window is enlarged and centred (13.2-86.8% across, 8.9-97.9% down, between the stripes and the bottom) with the original 1.1:1 proportion; bottom-right radius halved;
   stripes at 4.1% / 6.4% height, caption ends at 82.2%, right stripes 83.7-95%, LED at 6.9% / 38.7%, large bottom-right radius. */
.lens{position:relative;aspect-ratio:100/77.1;background:#7c7482;border-radius:10px 10px 30px 10px;container-type:inline-size;box-shadow:inset 0 1px 0 rgba(255,255,255,.12),0 2px 0 rgba(0,0,0,.18)}
.lens .band{position:absolute;top:3cqw;height:3.5cqw} /* caption and stripes 1.5x the original size */
.lens .st{background:linear-gradient(#ab2b64 0 27%,transparent 27% 73.5%,#141a6a 73.5% 100%)}
.lens .lrow{left:3.8%;width:83%;display:flex;align-items:center;gap:2.3cqw}
.lens .lrow .st{flex:1;height:100%}
.lens .cap{font:500 4.43cqw/1 Jost,Futura,"Century Gothic",system-ui,sans-serif;color:#ccc6d2;letter-spacing:.02em;white-space:nowrap}
.lens .rs{left:88.3%;width:7.9%}
.led{position:absolute;left:6.9%;top:30.7cqw;width:4%;aspect-ratio:1;transform:translate(-50%,-50%);border-radius:50%;background:#3b2a31;box-shadow:inset 0 1px 2px rgba(0,0,0,.55)}
.led.on{background:#ff3b30;box-shadow:0 0 1.6cqw #ff3b30,inset 0 -1px 2px rgba(0,0,0,.3)}
.status{margin:8px 2px 0;color:var(--soft);font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;min-height:44px;padding:0 18px;border-radius:22px;border:0;font:600 15px Inter,system-ui,sans-serif;cursor:pointer;background:var(--card);color:var(--ink);box-shadow:inset 0 0 0 1px var(--line)}
.btn.a{background:var(--a);color:#fff;box-shadow:0 2px 0 #5e1235}
.btn.lcd{background:var(--lcd);color:var(--screen);box-shadow:0 2px 0 #306230;font-size:16px}
.btn:focus-visible{outline:3px solid var(--lcd);outline-offset:2px}
.btn[disabled]{opacity:.45}
.row{display:flex;flex-wrap:wrap;gap:8px;margin-top:14px}
[hidden]{display:none!important}
.row.one{display:grid;grid-template-columns:repeat(3,minmax(0,1fr))}.row.one .btn{padding:0 6px;white-space:nowrap}
.btn.saved{background:#306230;color:#e8f5b0;box-shadow:0 2px 0 #0f380f}
.pair{display:grid;gap:8px;margin-top:10px}.pair .btn{width:100%;white-space:nowrap;padding:0 10px}
.codebox{margin-top:10px;padding:8px 14px 10px;border-radius:12px;background:var(--card)}
.codebox label{font-weight:600;font-size:15px}
.coderow{display:grid;grid-template-columns:minmax(0,1fr);margin-top:4px}
.coderow input{min-height:44px;border-radius:10px;border:1px solid var(--line);background:var(--bg);color:var(--ink);font:600 17px ui-monospace,Menlo,monospace;padding:0 12px;text-transform:uppercase}
.coderow input.bad{border-color:#d0453a;box-shadow:0 0 0 1px #d0453a}
.game{margin-top:8px;padding:6px 12px;border-radius:10px;background:var(--bg)}
.game b{display:block;font-size:17px;line-height:1.3;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.game .sm{font-size:14px;color:var(--soft);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sugg{display:flex;flex-wrap:wrap;gap:8px;margin-top:8px}.sugg .btn[data-act]{font:600 15px Inter,system-ui,sans-serif;flex:1;white-space:nowrap;padding:0 10px}.sugg .btn{min-height:40px;font:600 15px ui-monospace,Menlo,monospace}
.coderow input:focus-visible{outline:3px solid var(--lcd);outline-offset:1px}
@media(max-width:360px){.row.one .btn{font-size:14px}}
input[type=file]{position:absolute;width:1px;height:1px;opacity:0;pointer-events:none}
.result{margin-top:10px}
.game .ph{color:var(--soft);font-weight:600}
.game .own{color:var(--lcd)}
/* ownership flag before the game name: read-only box, ticked when the game is in the collection */
.flag{display:inline-block;position:relative;width:18px;height:18px;margin-right:8px;vertical-align:-2px;border:2px solid var(--lcd);border-radius:4px;box-sizing:border-box;pointer-events:none}
.flag.on{background:var(--lcd)}.flag.on::after{content:"";position:absolute;left:4px;top:0;width:5px;height:10px;border:solid #0f380f;border-width:0 2.5px 2.5px 0;transform:rotate(45deg)}
.flag.dim{opacity:.35}
.out{display:grid;grid-template-columns:minmax(0,150px) minmax(0,1fr);gap:16px;align-items:stretch}
.side{display:flex;flex-direction:column;justify-content:space-between;gap:8px}
.meta.one{margin:0;font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;text-align:center}
.side .pair{margin:0;gap:6px}
/* three stacked buttons beside the photo, kept to the photo's height */
.side{gap:4px}.side .btn{min-height:38px}
/* Save / Add image: two buttons that look like one pill broken in two along a slanted cut (4px gap).
   Each half is as wide as its longest label + equal padding, so the two labels sit centred across the whole pill.
   Labels for every state overlap in one cell (only the current one visible), so a half never changes width. */
.split{display:flex}
.split .btn{flex:1 1 auto;width:auto;white-space:nowrap;padding:0 14px;min-width:0}
.split .btn:first-child{border-radius:19px 0 0 19px;clip-path:polygon(0 0,100% 0,calc(100% - 9px) 100%,0 100%)}
.split .btn:last-child{border-radius:0 19px 19px 0;margin-left:-5px;clip-path:polygon(9px 0,100% 0,100% 100%,0 100%)}
.split .btn[hidden]{display:none}.split .btn[hidden]+.btn{margin-left:0;border-radius:19px;clip-path:none}
.split .btn.saved{background:#306230;color:#e8f5b0;box-shadow:none}
.lb{display:grid}.lb>span{grid-area:1/1;visibility:hidden;text-align:center}
[data-s=""] .lb>[data-s=""],[data-s=saved] .lb>[data-s=saved],[data-s=failed] .lb>[data-s=failed],[data-s=added] .lb>[data-s=added]{visibility:visible}
.cartshape{filter:drop-shadow(0 6px 10px rgba(0,0,0,.3))}
.out img{width:100%;display:block;background:#000}
/* On-screen only: DMG cart outline (step notch top right, 8.6% x 4.7%, smooth rounded corners) with a darker grey edge. The saved photo stays a plain rectangle. */
.frame,.out img,.cart,.cart img{clip-path:polygon(0% 3.85%,0.09% 3.1%,0.34% 2.37%,0.75% 1.71%,1.3% 1.13%,1.97% 0.65%,2.73% 0.29%,3.57% 0.07%,4.43% 0%,90.13% 0%,90.62% 0.08%,91.03% 0.32%,91.3% 0.68%,91.4% 1.1%,91.4% 3.6%,91.5% 4.02%,91.77% 4.38%,92.18% 4.62%,92.67% 4.7%,98.73% 4.7%,99.22% 4.78%,99.63% 5.02%,99.9% 5.38%,100% 5.8%,100% 96.15%,99.91% 96.9%,99.66% 97.63%,99.25% 98.29%,98.7% 98.87%,98.03% 99.35%,97.27% 99.71%,96.43% 99.93%,95.57% 100%,4.43% 100%,3.57% 99.93%,2.73% 99.71%,1.97% 99.35%,1.3% 98.87%,0.75% 98.29%,0.34% 97.63%,0.09% 96.9%,0% 96.15%)}
.frame{background:#5d5a63;padding:4px}
.meta{font-size:14px;color:var(--soft)}
.meta b{color:var(--ink);font-weight:600}
@media(max-width:480px){.out{grid-template-columns:minmax(0,150px) minmax(0,1fr)}}

/* ---------- Collection: Home cover, Catalog, Game (one screen shown at a time) ---------- */
body{display:block}
.scr{display:none}
#scan.on{display:flex;flex-direction:column;justify-content:flex-start;min-height:calc(var(--H) - var(--st) - var(--sb))}
#scan main{padding:41px 20px 8px} /* lens sits exactly where the cover's grey banner sits, same corners */
.app.on{display:flex;flex-direction:column;gap:14px;height:calc(var(--H) - var(--st) - var(--sb));max-width:640px;margin:0 auto;padding:14px 20px 16px;overflow:hidden;line-height:1.3}
.app button{font-family:inherit;cursor:pointer;-webkit-tap-highlight-color:transparent}
.banner{flex:none;background:#7c7482;border-radius:10px 10px 30px 10px;padding:14px 16px 16px;display:flex;flex-direction:column;gap:12px;box-shadow:inset 0 1px 0 rgba(255,255,255,.12),0 2px 0 rgba(0,0,0,.18)}
/* Cover: the top band is kept only as a spacer (banner stays put); the banner carries the scanner lens's stripes at the same spot instead. */
#home .topband,#cat .topband,#gv .topband,#bk .topband{visibility:hidden}
#home .banner,#cat .banner,#gv .banner,#bk .banner{position:relative;container-type:inline-size;padding-top:calc(6.5% + 12px)}
/* Catalog lens: same size as the cover's; back button and counter centred between the stripes and the search bar (same spot on Game and Backup). */
#cat .bnr{align-items:flex-start;height:48px}#cat .btx,#bk .btx{margin-top:0}
/* Home: text block at the row top, so the counter sits on the same line as the Catalog counter; label + carts line keep their spacing under it */
#home .btx{align-self:flex-start}#home .big{white-space:nowrap}#home .lbl{height:17px;line-height:17px;font-size:13.6px;letter-spacing:2.27px;white-space:nowrap}#hSub{height:19px;line-height:19px;font-size:13.2px;white-space:nowrap} /* fixed sizes: as wide as a 3-digit counter ("300 / 585") */
/* Game lens: same size and spot; back button where it is on the Catalog; title + year where the counter is */
/* Game lens: back button at the Catalog's spot; the title gets two reserved lines right after it, centred on it.
   The photo rides up over the lens, 8px under the title, its left edge on the variant checkboxes (14px in).
   Numbers: back centre 20px into the 92px row; title box 48px (20 ± 24); photo top 68px above the lens bottom. */
#gv .bnr{align-items:flex-start;height:92px}#gv .rslot{width:40px}#gv .rslot .back{width:40px;height:40px}
.gtl{flex:1;height:48px;margin-top:-4px;display:flex;align-items:center;color:#1a181d}
.gtl b{font:700 22px/1.1 Jost,system-ui,sans-serif;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
#gv .ghead{margin-top:-70px;padding-left:14px;align-items:flex-start;position:relative;z-index:1}
#gv .gtx{padding:68px 0 0}
.rslot{flex:none;width:92px;height:40px;margin-top:0;display:grid;place-items:center start} /* same box as the counter: back is centred on it, left edge on the search bar's */#cat .rslot .back,#bk .rslot .back{width:40px;height:40px}
/* same lens size as the cover: below the stripes 48px counter row + 4px + 40px search = the cover's 92px ring row */
#cat .banner{gap:4px}#cat .search{height:40px}
/* Same layout as the scanner lens (stripes + caption). cqw here = banner width minus its 32px side padding, hence the small px corrections. */
.bband{position:absolute;top:calc(3cqw + .96px);height:calc(3.5cqw + 1.12px)}
.bst{background:linear-gradient(#ab2b64 0 27%,transparent 27% 73.5%,#141a6a 73.5% 100%)}
.brow{left:3.8%;width:83%;display:flex;align-items:center;gap:calc(2.3cqw + .74px)}.brow .bst{flex:1;height:100%}
.bcap{font:500 calc(4.43cqw + 1.42px)/1 Jost,Futura,"Century Gothic",system-ui,sans-serif;color:#ccc6d2;letter-spacing:.02em;white-space:nowrap}
.brs{left:88.3%;width:7.9%}
.stripes{display:flex;flex-direction:column;gap:3px}.stripes i{height:4px;background:#ab2b64}.stripes i+i{background:#1f2470}
.bnr{display:flex;align-items:center;gap:16px}
.ring{--p:0;flex:none;width:92px;height:92px;border-radius:50%;background:conic-gradient(#9bbc0f calc(var(--p)*1%),#3a3740 0);display:grid;place-items:center}
.ring span{width:68px;height:68px;border-radius:50%;background:#7c7482;display:grid;place-items:center;font:700 22px/1 Jost,system-ui,sans-serif;color:#141416}
.btx{display:flex;flex-direction:column;gap:3px;color:#1a181d;font-size:12px}
.big{font:700 38px/1 Jost,system-ui,sans-serif}.big small{font-size:18px}
.lbl{font:700 12px/1.2 Jost,system-ui,sans-serif;letter-spacing:2px}
.card{background:#1c1a20;border-radius:12px;padding:12px 14px 14px;display:flex;flex-direction:column;gap:9px;flex:none}
.card.grow{flex:1;min-height:0}
.ch{display:flex;justify-content:space-between;align-items:center;font-size:12px;color:#a9a4b0}
.lnk{background:none;border:0;color:#a9a4b0;font:12px Inter,system-ui,sans-serif;padding:6px 0 6px 12px;margin:-6px 0}
.gwrap{flex:1;min-height:0;position:relative}.gwrap canvas{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);touch-action:none;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
.gtip{position:absolute;z-index:2;left:0;top:0;pointer-events:none;transform:translate(-50%,-100%);max-width:100%;background:#2a2730;color:#fff;font:600 13px/1.2 Inter,system-ui,sans-serif;padding:6px 10px;border-radius:8px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;box-shadow:0 4px 14px rgba(0,0,0,.5)}.gtip[hidden]{display:none}
.gloupe{position:absolute;z-index:2;left:0;top:0;width:124px;height:92px;border-radius:44px;pointer-events:none;transform:translate(-50%,-50%);background:#1c1a20;box-shadow:0 0 0 1px rgba(255,255,255,.14),0 10px 28px rgba(0,0,0,.55),0 2px 6px rgba(0,0,0,.4)}
.app{-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}.app input{-webkit-user-select:text;user-select:text}.gloupe[hidden]{display:none}.gloupe.held,.gtip.held{pointer-events:auto;cursor:pointer}
.recent{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}
.rc{display:flex;flex-direction:column;gap:4px;background:none;border:0;padding:0;color:#a9a4b0;font:9px/1.2 Inter,system-ui,sans-serif;text-align:left}
.rc span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-height:11px}
.cw{position:relative;display:block}
.cart{display:block;aspect-ratio:56/65;width:100%;background:#5d5a63;padding:2px}.cart img{display:block;width:100%;height:100%;object-fit:cover;background:#a09ca7}
.ghost{display:block;aspect-ratio:56/65;width:100%;border:1px dashed #4a4651;border-radius:4px 10px 4px 4px;background:#26232a}
.dot{position:absolute;right:4px;bottom:4px;width:16px;height:16px;border-radius:50%;background:#9bbc0f;box-shadow:0 0 0 2px rgba(0,0,0,.35);display:grid;place-items:center;font:700 10px/1 Jost,system-ui,sans-serif;font-style:normal;color:#121114}
.wide{flex:none;height:52px;border-radius:12px;border:0;background:#2a2730;color:#fff;font:700 15px Jost,system-ui,sans-serif;letter-spacing:2px;margin:auto 64px 0 0}
.fab{position:fixed;z-index:5;right:max(20px,calc(var(--W) / 2 - 300px));bottom:calc(16px + var(--sb));width:52px;height:52px;padding:0;border-radius:50%;border:0;background:#ab2b64;color:#fff;display:grid;place-items:center;box-shadow:0 4px 14px rgba(0,0,0,.5);cursor:pointer;-webkit-tap-highlight-color:transparent}
.fab .x{display:none}.fab.close .x{display:block}.fab.close .p{display:none}
.back{flex:none;width:44px;height:44px;border-radius:50%;background:#1c1a20;border:0;color:#fff;display:grid;place-items:center;padding:0}
.topband{flex:none;margin-top:2px}
.mini{display:flex;gap:3px;width:48px}.mini i{flex:1;height:3px;background:#ab2b64}.mini i+i{background:#1f2470}
.search{flex:none;display:flex;align-items:center;gap:8px;height:44px;background:#1c1a20;border-radius:12px;padding:0 14px;color:#a9a4b0}
.search input{flex:1;height:100%;background:transparent;border:0;color:#fff;font:16px Inter,system-ui,sans-serif;outline:none;-webkit-appearance:none;appearance:none}
.search input::placeholder{color:#8d8895}
.search input::-webkit-search-cancel-button{-webkit-appearance:none;display:none}
.qx{flex:none;width:22px;height:22px;margin-right:-4px;padding:0;border:0;border-radius:50%;background:#4a4651;color:#fff;display:grid;place-items:center;cursor:pointer}.qx[hidden]{display:none}
.seg{flex:none;display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:4px;background:#1c1a20;border-radius:12px;padding:4px}
.seg button{height:36px;border:0;border-radius:9px;background:transparent;color:#a9a4b0;padding:0 2px;font:600 12px Inter,system-ui,sans-serif;white-space:nowrap}.seg button.on{background:#3a3740;color:#fff}
.tiles{flex:1;min-height:0;overflow-y:auto;overscroll-behavior:contain;display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px 8px;align-content:start;padding:0 0 84px;-webkit-mask-image:linear-gradient(#000 calc(100% - 48px),transparent);mask-image:linear-gradient(#000 calc(100% - 48px),transparent)}
.tile{display:flex;flex-direction:column;gap:5px;background:none;border:0;padding:0;color:#e8e6ea;text-align:left;font:10px/1.25 Inter,system-ui,sans-serif}
.tile .nm{height:25px;overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.tile.miss .nm{color:#77727e}
.ghead{flex:none;display:flex;gap:16px;align-items:flex-end}
.gph{flex:none;width:176px}
.gtx{display:flex;flex-direction:column;gap:6px;padding-bottom:4px;font-size:13px;color:#a9a4b0}
.gtx b{font:700 22px/1.1 Jost,system-ui,sans-serif;color:#e8e6ea}
.gtx .own,.own{color:#9bbc0f}
.vars{flex:1;min-height:0;overflow-y:auto;padding:4px 14px;gap:0}
.vars.edit{box-shadow:inset 0 0 0 2px #ab2b64}
.vr{flex:none;display:flex;align-items:center;gap:12px;min-height:46px;width:100%;border:0;border-bottom:1px solid #2a2730;background:none;color:#a9a4b0;padding:0;text-align:left;font:12px Inter,system-ui,sans-serif}
.vr:last-child{border-bottom:0}
.vr .flag{margin:0;border-color:#4a4651}.vr.on .flag{border-color:#9bbc0f}
.vr .cd{flex:1;font:500 15px Jost,system-ui,sans-serif;letter-spacing:1px}.vr.on .cd{color:#fff}
.two{flex:none;display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;margin:auto 64px 0 0}
.two button{height:52px;border-radius:12px;border:0;background:#2a2730;color:#fff;font:600 14px Inter,system-ui,sans-serif}
.two button.on{background:#ab2b64}
.two.three{grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}.two.three button{font-size:13px;padding:0 4px}
.two button:disabled{opacity:.4;cursor:default}
/* Home: save icon under the short right stripe (opens Backup) */

// CORE START
function boxBlur(a,w,h,r){const t=new Float32Array(a.length),n=2*r+1;

  for(let y=0;y<h;y++){a[y*w+x]=s/n;s+=t[Math.min(h-1,y+r+1)*w+x]-t[Math.max(0,y-r)*w+x];}}}
function otsu(D){let mx=0;for(const v of D)if(v>mx)mx=v;if(mx<=0)return 0;const H=new Float64Array(256);
 for(const v of D)H[Math.min(255,(v/mx*255)|0)]++;const N=D.length;let sum=0;for(let i=0;i<256;i++)sum+=i*H[i];
 let sB=0,wB=0,best=-1,th=0;for(let i=0;i<256;i++){wB+=H[i];if(!wB)continue;const wF=N-wB;if(!wF)break;sB+=i*H[i];
  const v=wB*wF*(sB/wB-(sum-sB)/wF)**2;if(v>best){best=v;th=i;}}return (th+1)/255*mx;}
function morph(m,w,h,dil){const o=new Uint8Array(m.length);for(let y=0;y<h;y++)for(let x=0;x<w;x++){const c=m[y*w+x];let v=c;
 for(let dy=-1;dy<=1;dy++)for(let dx=-1;dx<=1;dx++){const yy=y+dy,xx=x+dx;const p=(yy<0||yy>=h||xx<0||xx>=w)?c:m[yy*w+xx];if(dil?p:!p)v=dil?1:0;}
 o[y*w+x]=v;}return o;}
function largest(m,w,h){const lab=new Int32Array(m.length),st=new Int32Array(m.length);let best=0,bestL=0,L=0;
 for(let i=0;i<m.length;i++){if(!m[i]||lab[i])continue;L++;let sp=0,n=0;st[sp++]=i;lab[i]=L;
  while(sp){const p=st[--sp];n++;const x=p%w,y=(p/w)|0;
   if(x>0&&m[p-1]&&!lab[p-1]){lab[p-1]=L;st[sp++]=p-1}
   if(x<w-1&&m[p+1]&&!lab[p+1]){lab[p+1]=L;st[sp++]=p+1}
   if(y>0&&m[p-w]&&!lab[p-w]){lab[p-w]=L;st[sp++]=p-w}
   if(y<h-1&&m[p+w]&&!lab[p+w]){lab[p+w]=L;st[sp++]=p+w}}
  if(n>best){best=n;bestL=L}}return {lab,L:bestL,area:best};}
function hull(P){P=P.slice().sort((a,b)=>a[0]-b[0]||a[1]-b[1]);const cr=(o,a,b)=>(a[0]-o[0])*(b[1]-o[1])-(a[1]-o[1])*(b[0]-o[0]);const lo=[],up=[];
 for(const p of P){while(lo.length>=2&&cr(lo[lo.length-2],lo[lo.length-1],p)<=0)lo.pop();lo.push(p)}

 if(gForgot.has(c))gForgot.delete(c);else if(gArm!=='photo'){gArm='photo';return drawGame()}else gForgot.add(c);gArm=false;drawGame()});
// Any other tap cancels a delete waiting for confirmation.
document.addEventListener('pointerdown',e=>{if(gArm===false||!gEditing)return;const t=e.target;
 if(t.closest('#gForget')&&gArm==='photo'||t.closest('#gDelB')&&gArm==='game'||t.closest('#gRst')&&gArm==='reset'||t.closest(`[data-r="${gArm}"]`))return;gArm=false;
 $('gVars').querySelectorAll('.rm.arm').forEach(b=>{b.classList.remove('arm');b.textContent='×'}); // restyle in place so the tap itself still lands
 const d=$('gDelB');if(d){d.classList.remove('arm');d.textContent='Delete game'}const rs=$('gRst');if(rs){rs.classList.remove('arm');rs.textContent='Reset to built-in'}const f=$('gForget');if(f.classList.contains('arm')){f.classList.remove('arm');f.textContent='Forget photo'}},true);
// Ownership changed in the scanner: screens redraw when they are shown again.
$('own').addEventListener('click',()=>{dirty=true});
// ---- Backup: one .zip (collection.json + photos/CODE.jpg) to keep in Files. Import restores it and replaces this phone's data. ----
const CRC=(()=>{const t=new Uint32Array(256);for(let n=0;n<256;n++){let c=n;for(let k=0;k<8;k++)c=c&1?0xEDB88320^(c>>>1):c>>>1;t[n]=c>>>0}return t})();
function crc32(u){let c=0xFFFFFFFF;for(let i=0;i<u.length;i++)c=CRC[(c^u[i])&255]^(c>>>8);return (c^0xFFFFFFFF)>>>0}
function zipBlob(files){const enc=new TextEncoder(),parts=[],cd=[],d=new Date();let off=0; // stored, no compression (JPEGs don't shrink)
 const dt=(d.getFullYear()-1980)<<9|(d.getMonth()+1)<<5|d.getDate(),tm=d.getHours()<<11|d.getMinutes()<<5|d.getSeconds()>>1;
 for(const f of files){const nm=enc.encode(f.name),crc=crc32(f.data),n=f.data.length,h=new DataView(new ArrayBuffer(30)),c=new DataView(new ArrayBuffer(46));
  h.setUint32(0,0x04034b50,true);h.setUint16(4,20,true);h.setUint16(6,0x800,true);h.setUint16(10,tm,true);h.setUint16(12,dt,true);h.setUint32(14,crc,true);h.setUint32(18,n,true);h.setUint32(22,n,true);h.setUint16(26,nm.length,true);
  c.setUint32(0,0x02014b50,true);c.setUint16(4,20,true);c.setUint16(6,20,true);c.setUint16(8,0x800,true);c.setUint16(12,tm,true);c.setUint16(14,dt,true);c.setUint32(16,crc,true);c.setUint32(20,n,true);c.setUint32(24,n,true);c.setUint16(28,nm.length,true);c.setUint32(42,off,true);
  parts.push(h,nm,f.data);cd.push(c,nm);off+=30+nm.length+n}
 const e=new DataView(new ArrayBuffer(22));e.setUint32(0,0x06054b50,true);e.setUint16(8,files.length,true);e.setUint16(10,files.length,true);e.setUint32(12,cd.reduce((s,p)=>s+p.byteLength,0),true);e.setUint32(16,off,true);
 return new Blob([...parts,...cd,e],{type:'application/zip'})}
function unzip(buf){const v=new DataView(buf),u=new Uint8Array(buf),dec=new TextDecoder(),out=new Map();let e=-1;
 for(let i=u.length-22;i>=Math.max(0,u.length-65557);i--)if(v.getUint32(i,true)===0x06054b50){e=i;break}
 if(e<0)throw 0;let p=v.getUint32(e+16,true);
 for(let k=v.getUint16(e+10,true);k>0;k--){if(v.getUint32(p,true)!==0x02014b50)throw 0;const nl=v.getUint16(p+28,true),lo=v.getUint32(p+42,true),cs=v.getUint32(p+20,true),
  name=dec.decode(u.subarray(p+46,p+46+nl)),ds=lo+30+v.getUint16(lo+26,true)+v.getUint16(lo+28,true);
  if(!name.startsWith('__MACOSX'))out.set(name,{m:v.getUint16(p+10,true),data:u.subarray(ds,ds+cs)});p+=46+nl+v.getUint16(p+30,true)+v.getUint16(p+32,true)}
 return out}
async function entryBytes(x){if(x.m===0)return x.data; // re-zipped elsewhere: deflate
 if(x.m===8&&window.DecompressionStream)return new Uint8Array(await new Response(new Blob([x.data]).stream().pipeThrough(new DecompressionStream('deflate-raw'))).arrayBuffer());throw 0}
let bkZip=null,bkPend=null,bkJob=0,bkBusy=false;
const MB=b=>b<1048576?Math.max(1,Math.round(b/1024))+' KB':(b/1048576).toFixed(b<10485760?1:0)+' MB';
function bkLog(){try{const l=JSON.parse(localStorage.getItem('dmgBkLog')||'[]');return Array.isArray(l)?l:[]}catch(e){return []}}
function bkAdd(k,c,p){const l=bkLog();l.push({t:Date.now(),k,c,p});try{localStorage.setItem('dmgBkLog',JSON.stringify(l.slice(-50)))}catch(e){}}
function drawHist(){const box=$('bList'),l=bkLog().reverse();if(!l.length){box.innerHTML='<p class="hnone">No exports or imports yet</p>';return}
 const n=Math.max(1,Math.floor(box.clientHeight/34)),d=t=>{const x=new Date(t),z=n=>String(n).padStart(2,'0');return x.toLocaleDateString('en-GB',{day:'numeric',month:'short',year:'numeric'})+` · ${z(x.getHours())}:${z(x.getMinutes())}`};
 box.innerHTML=l.slice(0,n).map(r=>`<div class="hr"><b class="${r.k}">${r.k==='e'?'Export':'Import'}</b><span>${d(r.t)}</span><i>${r.c}</i><i>${r.p}</i></div>`).join('')}
function bkStamp(){return ''} // idle: blank (the History card shows past exports/imports)
function bkShow(carts,photos,size,sub){$('bN').innerHTML=`${carts}<small> cart${carts===1?'':'s'}</small>`;$('bP').textContent=`${photos} PHOTO${photos===1?'':'S'}`+(size?` · ${MB(size)}`:'');$('bT').textContent=sub}
function bkBtns(ask,off){$('bIn').textContent=ask?'Cancel':'Import';$('bEx').textContent=ask?'Replace':'Export';$('bIn').disabled=!!off;$('bEx').disabled=!!off}
// Opening the screen prepares the file at once, so Export can hand it straight to the share sheet (Save to Files).
async function drawBackup(msg){if(bkBusy)return;const job=++bkJob;bkPend=null;bkZip=null;bkBtns(false);$('bEx').disabled=true;
 bkShow(OWN_CODES.size,PHOTOS.size,0,'Preparing…');drawHist();
 const keys=(await idb('readonly',s=>s.getAllKeys()))||[],recs=(await idb('readonly',s=>s.getAll()))||[],files=[],ph={};
 for(let k=0;k<keys.length;k++){if(job!==bkJob)return;const r=recs[k];if(!r||!r.full)continue;files.push({name:`photos/${keys[k]}.jpg`,data:new Uint8Array(await r.full.arrayBuffer())});ph[keys[k]]=r.t||0}
 if(job!==bkJob||cur!=='bk')return;
 files.unshift({name:'collection.json',data:new TextEncoder().encode(JSON.stringify({dmgdb:1,exported:new Date().toISOString(),mods:MODS,games:GAMES,owned:[...OWN_CODES],recent:recentList(),english:[...ENG],photos:ph}))});
 bkZip=zipBlob(files);bkShow(OWN_CODES.size,files.length-1,bkZip.size,msg||bkStamp());$('bEx').disabled=false}
$('bEx').addEventListener('click',async()=>{if(bkPend)return bkRestore();if(!bkZip)return;
 const name=`dmgdb-backup-${new Date().toISOString().slice(0,10)}.zip`,file=new File([bkZip],name,{type:'application/zip'});
 try{if(navigator.canShare&&navigator.canShare({files:[file]}))await navigator.share({files:[file]});
  else{const a=document.createElement('a'),u=URL.createObjectURL(file);a.href=u;a.download=name;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(u),60000)}
  localStorage.setItem('dmgBackupT',Date.now());bkAdd('e',OWN_CODES.size,PHOTOS.size);$('bT').textContent=bkStamp();drawHist()}catch(e){}});
$('bIn').addEventListener('click',()=>{if(bkPend)return drawBackup();$('bFile').click()});
// Picking a backup shows what is in it and asks before replacing anything.
$('bFile').addEventListener('change',async e=>{const f=e.target.files[0];e.target.value='';if(!f||bkBusy)return;bkJob++;bkZip=null;
 try{const z=unzip(await f.arrayBuffer()),names=[...z.keys()],cj=names.find(n=>/(^|\/)collection\.json$/.test(n));if(!cj)throw 0;
  const col=JSON.parse(new TextDecoder().decode(await entryBytes(z.get(cj))));if(!col||col.dmgdb!==1||!Array.isArray(col.owned))throw 0;
  const photos=names.filter(n=>/(^|\/)photos\/DMG-[A-Z0-9-]+\.jpg$/i.test(n));
  bkPend={z,col,photos};bkShow(col.owned.length,photos.length,f.size,"Replace this phone's collection?");bkBtns(true)}
 catch(err){bkPend=null;bkBtns(false);$('bEx').disabled=true;$('bT').textContent='Not a DMG db backup'}});
async function bkRestore(){const {z,col,photos}=bkPend;bkPend=null;bkBusy=true;bkBtns(false,true);let n=0;
 try{await idb('readwrite',s=>s.clear());PHOTOS.clear();for(const u of THUMB.values())URL.revokeObjectURL(u);THUMB.clear();
  for(let k=0;k<photos.length;k++){$('bT').textContent=`Importing ${k+1} / ${photos.length}`;const code=photos[k].split('/').pop().slice(0,-4).toUpperCase();
   try{const full=new Blob([await entryBytes(z.get(photos[k]))],{type:'image/jpeg'}),thumb=await thumbOf(full);
    await idb('readwrite',s=>s.put({full,thumb,tv:3,t:(col.photos||{})[code]||Date.now()},code));PHOTOS.add(code);n++}catch(e){}}
  {const m=okMods(col.mods)?col.mods:okGames(col.games)?modsFrom(col.games):null;if(m){MODS=m;saveMods();buildGames();indexGames();built=false}} // backups carry my game-list changes
  setOwned(col.owned);ENG.clear();(Array.isArray(col.english)?col.english:[]).forEach(c=>ENG.add(c));
  try{localStorage.setItem('dmgOwned',JSON.stringify([...OWN_CODES]));localStorage.setItem('dmgRecent',JSON.stringify(Array.isArray(col.recent)?col.recent.slice(-60):[]));localStorage.setItem('dmgEnglish',JSON.stringify([...ENG]))}catch(e){}
 }catch(e){}
 bkAdd('i',OWN_CODES.size,n);dirty=true;bkBusy=false;if(cur==='bk'){drawHist();drawBackup(`Imported ✓ · ${n} photo${n===1?'':'s'}`)}}
refresh();tipCheck();
}
